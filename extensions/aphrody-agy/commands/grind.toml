# /grind <objectif> — arme la boucle de codage autonome aphrody puis demarre.
description = "Demarre une boucle de codage autonome aphrody sur un objectif (no human in the loop)."
prompt = """
!{aphrody agy-loop start --goal "{{args}}"}

Tu es en MODE BOUCLE AUTONOME aphrody. OBJECTIF : {{args}}

Regles non negociables :
- Autonomie totale, AUCUNE question a l'utilisateur. Decide seul.
- Vrai code de production : zero stub, zero TODO, zero mock.
- Apres chaque changement : build + tests ; corrige tout echec avant de continuer.
- Cross-platform (Linux #1, Windows, macOS) ; pas de regression.
- Commits Conventional Commits au fil de l'eau.

Commence MAINTENANT par la premiere etape concrete. La boucle te relancera
automatiquement a chaque tour. Quand — et seulement quand — l'objectif est
entierement implemente, verifie vert (build + tests) et committe, ecris le jeton
exact APHRODY_LOOP_DONE seul sur ta derniere ligne.
"""
