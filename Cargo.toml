# --- MCP -----------------------------------------------------------------
rmcp               = { git = "https://github.com/modelcontextprotocol/rust-sdk.git", features = ["server", "transport-io", "macros", "schemars"] }

# --- Terminal emulation ---------------------------------------------------
vte                = { version = "0.15" }
# portable-pty: ConPTY (Windows) + openpty (Unix) via a single API.
portable-pty       = { version = "0.8" }
# tokio-tungstenite: async WebSocket client/server on top of tokio.
tokio-tungstenite  = { version = "0.24" }

# --- Windows bindings -----------------------------------------------------
windows            = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_IO",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
] }
windows-sys        = { version = "0.61", features = ["Win32_Foundation"] }
winapi-util        = { version = "0.1" }

# --- C / C++ FFI (Chromium-style: `cxx` primary, `bindgen` for large APIs) -
# Use `cxx` for safe, typed bridges declared in `#[cxx::bridge(namespace = "...")]`.
# Use `bindgen` only when the C/C++ surface is too large to wrap manually.
# See docs/cargo/FFI_POLICY.md and docs/cargo/CHROMIUM_ANDROID_PATTERNS.md.
cxx                = { version = "1.0" }
cxx-build          = { version = "1.0" }
bindgen            = { version = "0.72" }

# --- Binary / archive parsers (game RE, IEVR) -----------------------------
# `goblin` reads PE/ELF/Mach-O/COFF headers (used to inspect `nie.exe`,
# `EOSSDK-Win64-Shipping.dll`, etc.).  `byteorder` provides LE/BE primitive
# reads for the CRI @UTF tables that back CPK / USM / AWB containers.
goblin             = { version = "0.10", default-features = false, features = ["std", "endian_fd", "pe32", "pe64", "elf32", "elf64"] }
byteorder          = { version = "1.5" }
# `iced-x86` — pure Rust x86/x64 disassembler + formatter (Intel/AT&T/Nasm/Masm).
# No C dependencies, no GPL, compiles on all targets including wasm32.
# Used by aphrody-re::disasm (Apex Cap R5, Sprint R-E, item R5.4).
iced-x86           = { version = "1.21" }
# `yara-x` — pure Rust YARA pattern-matching engine (BSD-3-Clause, no C, no GPL).
# Used by aphrody-re::yara for `aphrody re yara --rules <rules.yara> <binary>`.
# Host-only (reads files from disk + compiles YARA rules); not wasm-safe.
# Pinned to 1.16 (latest stable 2026-05-22). `default-features = false` drops
# the heavy default-modules bundle (pe-module, elf-module, crypto, protobuf-
# codegen, …) — we only need the core scanner + the string/pattern engine.
# The `inventory` feature is required by the build script (either `inventory`
# or `linkme` must be active — we choose `inventory` for cross-platform
# compatibility without platform-specific linker tricks).
yara-x             = { version = "1.16", default-features = false, features = ["inventory"] }

# --- POSIX shim helpers (Linux/macOS bridges) -----------------------------
nix-cross          = { package = "nix", version = "0.31", default-features = false }

# --- Google Rust crates (org:google, Apache-2.0 / BSD-2-Clause / MIT) ------
# `zerocopy` — zero-cost memory layout validation + safe casting. Used by
# aphrody-re::headers for zero-copy PE/ELF magic header inspection.
# BSD-2-Clause OR Apache-2.0 OR MIT; MSRV 1.56; 599M downloads; active 2026-05.
zerocopy           = { version = "0.8", features = ["derive"] }
# `fancy-regex` — regex with backreferences + lookahead/lookbehind. Used by
# aphrody-re::google for OAuth client-ID pattern extraction. MIT; MSRV 1.66.
fancy-regex        = { version = "0.18" }
# `googletest` — GoogleTest-style matchers for Rust (dev-dep only).
# Apache-2.0; MSRV 1.70; 6.3M downloads; active 2025-06.
googletest         = { version = "0.14" }

# --- Test / bench / fuzz --------------------------------------------------
rstest             = { version = "0.26" }
proptest           = { version = "1" }
criterion          = { version = "0.8" }
pretty_assertions  = { version = "1" }
assert_cmd         = { version = "2" }
predicates         = { version = "3" }

# --- Agent skills (SKILL.md ecosystem) ------------------------------------
