web-sys            = { version = "0.3" }
# Math + POD casting for wgpu pipelines. Aligned EXACTLY with
# winclean/apps/iecode-web/crates/ievr-engine pins (handoff M1 in
# C:/winclean/ai.json shared_resources.code_modules#ievr-engine.deps_pinned).
# Latest crates.io as of 2026-05-17 : glam 0.32.1, bytemuck 1.25.0.
# We hold glam at 0.30 because ievr-engine consumer pins 0.30.10 — bump together.
glam               = { version = "0.30" }
bytemuck           = { version = "1.25", features = ["derive"] }
# Logging in browser WASM contexts.
log                        = { version = "0.4" }
console_log                = { version = "1.0" }
console_error_panic_hook   = { version = "0.1" }

# --- System info (cross-platform: Linux /proc + Windows WMI-free) ---------
sysinfo            = { version = "0.39", default-features = false, features = ["system", "disk"] }

# --- Misc -----------------------------------------------------------------
itertools          = { version = "0.14" }
nix                = { version = "0.31" }
# `arc-swap` — lock-free atomic swap of an `Arc<T>`. Backs the hot-reload of
# `Arc<AgentHome>` in aphrody-agent-home (notify watcher swaps the live home
# without a mutex). Cross-platform, zero unsafe at the consumer level.
arc-swap           = { version = "1.7" }
# `gix` — pure-Rust git (no shell-out, no libgit2 C). Backs the optional `git`
# feature of aphrody-agent-home (workspace backup: init/add/commit). Default
# network/TLS features deliberately omitted; add `worktree-mutation` for the
# commit-on-HEAD path.
gix                = { version = "0.83", default-features = false, features = ["sha1", "basic", "extras", "comfort", "max-performance-safe", "revision", "index", "worktree-mutation"] }
# aphrody-agent-home — the agent's persistent home: Soul / Identity / User /
# Tools typed model, mmap zero-copy file cache, content-addressed cache,
# bootstrap budget, system-prompt assembler, hot-reload, git backup.
aphrody-agent-home = { path = "crates/aphrody-agent-home", version = "1.0.0-canary" }
# Unicode helpers (consumed by aphrody-tui dev-deps + future TUI layout).
