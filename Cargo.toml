mdxjs                          = { version = "1" }

# --- WebGPU / WASM (cf. règle 2026-05-17 : tout nouveau projet web cible WASM/WebGPU) ---
# Versions validées via context7 (2026-05-17) : wgpu v26 stable (v29 disponible).
wgpu               = { version = "29" }
# wasm-bindgen MUST be pinned EXACT — schema must match wasm-bindgen-cli byte-for-byte.
