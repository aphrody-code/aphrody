# --- Aphrody upstream forks (branche `aphrody` isolée d'upstream main) ----
# Intégration native via gh CLI : chaque fork a une branche dédiée `aphrody`
# avec marker `.aphrody/INTEGRATION.md` et adaptations minimes (anonymisation,
# rust-version bump). Rewrite massif possible sur cette branche sans toucher
# au upstream main.
