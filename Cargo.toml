# ============================================================================
#  Aphrody — Workspace Manifest (Cargo 1.93+, Rust 2024, Nightly)
#  Production-grade, Google Style — Fuchsia/Chromium aligned.
# ============================================================================
[workspace]
resolver = "3"
members = [
    "crates/cli",
    "crates/backend",
    "crates/base",
    "crates/google_mcp",
    "crates/a2a",
    "crates/a2a-client",
    "crates/a2a-server",
    "crates/a2a-grpc",
    "crates/a2a-pb",
    # mrx — Monorepo Real-time X-platform mapper (unified from mrx-{core,detect,audit,watch,cli})
    "crates/mrx",
    # aphrody-translate — comment translation + AI-isms scrub + Aphrody style
    "crates/aphrody-translate",
    # aphrody-xtask supprimé le 2026-05-21 (cf. memory project-workspace-lean-build) :
    # crate de dev-tasks jugée inutile ; les tâches ponctuelles repassent en
    # scripts ps1/sh ad hoc ou commandes cargo directes.
    # aphrody-wasm EXTRACTED to C:\src\aphrody-ts (UI) — 2026-05-23.
    # ievr-tools — IEVR binary inventory analysis (consumes peer-Claude scan JSON)
    "crates/ievr-tools", "crates/aphrody-summary",
    # M3 + shadcn pixel-perfect coverage + A2A UI (tick 36 pivot, 2026-05-17)
    "crates/m3-tokens",      # M3 baseline tokens — KEPT (cli `design tokens` + shared by extracted UI)
    # mui-rs* (MD3 natif wgpu/vello/winit/parley) EXTRACTED to C:\src\aphrody-ts (UI) — 2026-05-23.
    "crates/a2a-ui",         # WASM channel viewer for .coord JSONL mailbox
    # antigravity-sdk — native Rust SDK for Antigravity (Google AI Ultra / Gemini):
    # OAuth token extraction from Windows Credential Manager + HTTP client.
    "crates/antigravity-sdk",
    # "crates/a2a-slimrpc",
    # ↳ Re-enable once upstream agntcy-slim-mls fixes elided-lifetime + async-fn-in-trait
    #   incompatibility with nightly 1.97+. Build path works (aws-lc-sys 0.29 + NASM
    #   + Ninja generator validated). Tracking: upstream agntcy/agp issue queue.
    # aphrody-memory — async MemoryBackend (JSONL/HNSW/SQLite/LanceDB) +
    # Tier-1 MemoryProvider trait (Mem0 HTTP / Honcho HTTP / SqliteLocal).
    "crates/aphrody-memory",
    # aphrody-embed — local, offline text embeddings (fastembed/ONNX Runtime).
    # Opt-in `embeddings` feature, host-only. Produces the dense vectors that
    # aphrody-memory's HNSW/LanceDB vector stores consume (no external API).
    "crates/aphrody-embed",
    # aphrody-gateway — provider-agnostic OpenAI-compatible AI gateway
    "crates/aphrody-gateway",
    # aphrody-mcp — Native Rust OAuth 2.1 client for HTTP/SSE MCP servers (RFC 9728/8414/7591/7636)
    "crates/aphrody-mcp",
    # aphrody-voice — TTS + STT provider traits + ElevenLabs/Whisper adapters + Discord shim
    "crates/aphrody-voice",
    "crates/aphrody-icons",
    # gemini-runtime — Gemini CLI runtime adapter (detect + version + stream)
    "crates/gemini-runtime",
    # obscura-runtime — façade binaire externe pour le moteur headless Obscura
    # (pilier R4 scraping). Zéro dépendance V8/compilation : spawn `obscura`
    # résolu via $APHRODY_OBSCURA_BIN > sibling > PATH.
    "crates/obscura-runtime",
    # aphrody-messaging — unified messaging (outbound connectors + bidirectional channels)
    "crates/aphrody-messaging",
    # aphrody-terminal-backend — native pty driver + WebSocket server for `aphrody term`.
    # The rest of the LLM-first terminal stack (vt/wasm/llm/browser/json-out/markdown/
    # config) + aphrody-tui were EXTRACTED to C:\src\aphrody-ts (UI) — 2026-05-23.
    "crates/aphrody-terminal-backend",
    # aphrody-skills — unified skills infrastructure (runtime + hooks + permissions)
    "crates/aphrody-skills",
    # aphrody-react-reconciler — host-side React reconciler primitives
    # (Rust port of packages/aphrody-jsx, Phase 4.2).
    "crates/aphrody-react-reconciler",
    # aphrody-design + aphrody-design-agents EXTRACTED to C:\src\aphrody-ts (UI) — 2026-05-23.
    # NOTE (2026-05-21, build-perf) : les clusters UI lourds `mui-rs*` (wgpu/vello/
    # winit/wasmtime) et `tuono*` (Next.js/SWC/lightningcss/mdxjs/napi) ainsi que
    # `gui` (qui agrège les deux) et `agui-bridge` ont été déplacés vers `exclude`.
    # Aucun n'est dans la chaîne de dépendance du binaire `aphrody` (crate `cli`).
    # Ils dominaient le temps de `cargo nextest run --workspace` sur cette machine
    # (4c/8t, 16 Go). Pour les rebâtir explicitement : voir le bloc `exclude` ci-dessous.

    # bxc rust-bridge (excluded)

    # aphrody-skills-forge — programmatic SKILL.md scaffolding + registry +
    # lint engine (Sprint D / skills-forge).
    "crates/aphrody-skills-forge",
    # aphrody-cron — async-friendly interval/daily/cron scheduler with
    # pluggable JSON-backed job store (Sprint E / hermes-agent).
    "crates/aphrody-cron",
    # aphrody-re — reverse engineering primitives: PE/ELF triage via goblin,
    # sections + Shannon entropy + SHA-256, ASCII/UTF-16 strings sample.
    # Pure Rust, no GPL deps. Apex Cap R5 (Sprint R-E).
    "crates/aphrody-re",
    # aphrody-capture — native Windows screen and window capture to PNG.
    # GDI BitBlt pipeline, RAII GDI guards, BGRA→RGBA conversion, image::png encoder.
    # Non-Windows: compile to stubs returning CaptureError::Unsupported.
    "crates/aphrody-capture",
    # aphrody-images — production-grade Nano Banana image generation, editing
    # and composition (async concurrent download, typed errors, batch generation,
    # data-URI decode). Surpasses the Python NanoBanana client.
    "crates/aphrody-images",
    # aphrody-firefly — pure-Rust Adobe Firefly Services client: IMS OAuth S2S
    # token core, v3 async image generation + poll + download. Cross-platform
    # (rustls), headless; shared auth core for the cloud Photoshop API.
    "crates/aphrody-firefly",
    # aphrody-logo — canonical icon (assets/aphrody.webp) embedded once ->
    # multi-res .ico, scalable .svg, M3 maskable/shape PNGs, pixel-perfect
    # terminal rendering (Kitty graphics protocol + truecolor half-blocks).
    "crates/aphrody-logo",
    # aphrody-marketplace — skill / MCP / hook / theme extension index
    # (Sprint F / hermes-agent : embedded + file + http loaders, semver +
    # tag queries, SHA-256 integrity verification).
    "crates/aphrody-marketplace",

    # aphrody-providers — single-source-of-truth `Provider` enum + ProviderError
    # for the three-only LLM whitelist (anthropic / gemini / antigravity).
    # Cf. memory project_aphrody_providers_3only + project_no_duplication_max_cohesion.
    "crates/aphrody-providers",
    # aphrody-router — LLM provider router with strict 3-only whitelist
    # (anthropic / gemini / antigravity). Cf. memory project_aphrody_providers_3only.
    "crates/aphrody-router",
    # aphrody-prompts — minijinja-backed prompt template registry with typed
    # required-variable validation, reusable `{% include %}` partials, and a
    # configurable PII scrubber (email, phone, IBAN, IPv4, API-key markers).
    "crates/aphrody-prompts",
    # aphrody-llm-infra — unified LLM runtime infrastructure (cost + rateguard + retry + cache)
    "crates/aphrody-llm-infra",
    # aphrody-context — LLM context-window manager: heuristic token counting,
    # sliding-window trim with pinned-message preservation, summarization
    # triggers, JSON snapshot/restore.
    "crates/aphrody-context",
    # aphrody-session — conversation session tracker (turns + tool calls +
    # token usage + cost, persistent JSONL log with atomic writes + replay).
    "crates/aphrody-session",
    # aphrody-tools — vendor-neutral tool descriptor registry (JSON Schema
    # input/output) with cross-vendor exporters/importers for Anthropic
    # tool-use, Gemini function declarations and MCP `tools/list` shapes.
    "crates/aphrody-tools",

    # aphrody-events — in-process async pub-sub event bus with topic filtering,
    # NDJSON audit sink, memory ring buffer and counter subscribers. No external
    # broker; complements aphrody-session (cold archive) + aphrody-hooks
    # (external commands) with a live in-process fan-out surface.
    "crates/aphrody-events",
    # aphrody-secrets — secret-store abstraction (env + plaintext file +
    # AES-256-GCM/Argon2id encrypted file + composite) with redacted Display/
    # Debug, constant-time equality, Zeroize-on-drop SecretValue.
    "crates/aphrody-secrets",
    # aphrody-settings — hierarchical JSON settings loader (user / project /
    # local / env) with deep-merge precedence, dotted-path navigation, env
    # `PREFIX_FOO__BAR=baz` nested expansion, and minimum-viable JSON Schema
    # validation (type / required / additionalProperties / properties / items).
    "crates/aphrody-settings",
    # aphrody-telemetry — in-process observability primitives: hierarchical
    # spans (RAII-finalized handles), monotonic atomic counters, bucketed
    # histograms, NDJSON file exporter. OpenTelemetry-inspired data model
    # without OTLP / gRPC / protobuf weight.
    "crates/aphrody-telemetry",
    # aphrody-task-runner — parallel DAG executor (topological sort + per-task
    # timeout/retry + Semaphore-bounded concurrency + NDJSON-friendly event
    # stream) for background pipelines that need explicit read-after-write
    # ordering. Complements aphrody-cron (when) and aphrody-hooks (single-shot
    # commands) with a typed multi-step orchestrator.
    "crates/aphrody-task-runner",
    # aphrody-search — in-memory full-text search (regex-free tokenizer with
    # EN+FR stop words, inverted index, BM25-lite scoring with title 2x
    # boost, snippet highlighting, atomic JSON persistence). Backs the
    # marketplace / memory / skill discovery UIs.
    "crates/aphrody-search",
    # aphrody-fsindex — persistent local-filesystem SQLite FTS5 search index
    # (mirrors the Google desktop app's local_files.db; metadata-only).
    "crates/aphrody-fsindex",
    # aphrody-chat — unified turn-loop REPL composing every other aphrody
    # building block (gemini-runtime + tools + memory + session + permissions
    # + hooks + prompts + router + cost + context + events + cache +
    # rateguard + retry + secrets + skills-runtime + mcp). Replaces the
    # packaged TypeScript gemini-cli dependency with a native Rust agent.
    "crates/aphrody-chat",
    # aphrody-sdk — public Rust SDK for embedding aphrody in third-party
    # programs (Agent + Session + ToolRegistry + Skills + FS + Shell).
    # Port of packages/gemini-cli/packages/sdk (TS, ~300 LoC).
    "crates/aphrody-sdk",
    # notebooklm — pure-Rust client for the Google NotebookLM Boq RPC
    # surface (ported from icebear0828/notebooklm-client + teng-lin/notebooklm-py
    # + jacob-bd/notebooklm-mcp-cli, all MIT). No browser automation in-crate.
    "crates/notebooklm",
    # gemini-web — pure-Rust client for the Gemini web app (gemini.google.com/app)
    # Boq batchexecute surface; mirrors notebooklm transport (cookie auth +
    # page-bootstrap token scrape + MaZiqc send/parse). No browser automation in-crate.
    "crates/gemini-web",
    # aphrody-mcp-smoke — end-to-end smoke test for the unified aphrody-mcp
    # stdio server (handshake + tools/list + tools/call sweep + p50/p95 +
    # NDJSON report). Replaces the ad-hoc bash/pwsh probes.
    "crates/aphrody-mcp-smoke",
    # aphrody-agent-home — the agent's persistent home (Soul / Identity / User /
    # Tools typed model + mmap zero-copy file cache + content-addressed blake3
    # cache + bootstrap budget + system-prompt assembler + notify hot-reload +
    # gix git backup). Rust port of openclaw agents/{workspace,bootstrap-budget,
    # identity}.ts, pushed past it via mmap / arc-swap / Send+Sync by construction.
    "crates/aphrody-agent-home",

    # Next.js / Turbopack integration (excluded)
]
exclude = [
    "crates/a2a-slimrpc",
    # ------------------------------------------------------------------------
    # Build-perf (2026-05-21) : clusters UI lourds sortis du workspace par
    # défaut. Pas de consommateur vital (le binaire `aphrody`/`cli` n'en dépend
    # pas). Rebâtir au besoin avec un workspace ad hoc ou en les re-listant
    # temporairement dans `members`.
    #   * tuono*  → Next.js SSR (swc_core v63, lightningcss, mdxjs, napi)
    #   * mui-rs* → MD3 natif (wgpu, vello, winit, wasmtime, parley, fontique)
    #   * gui     → agrège tuono* + mui-rs*
    #   * agui-bridge → consomme mui-rs-components
    # ------------------------------------------------------------------------
    # gui / agui-bridge / tuono{,_internal,_lib,_lib_macros} EXTRACTED to
    # C:\src\aphrody-ts (UI) — 2026-05-23 (were here as build-perf exclusions).
    # aphrody-x-client : self-rooted workspace (intégrera root workspace
    # plus tard quand agent-twitter-client 0.1.x stabilisé).
    "crates/aphrody-x-client",
    # n2b-* + bxc-engine : supprimés du dépôt le 2026-05-21 (crates retirées pour
    # de bon, cf. memory project-workspace-lean-build). `aphrody n2b` / la logique
    # bxc de aphrody-xtask restent des façades qui spawnent un binaire externe
    # optionnel (APHRODY_N2B_BIN / BXC_BIN) ; aucune dep de compilation.
    # vendor/ retiré 2026-05-18 : ne contenait que des stubs Bun/uv/depot_tools
    # (interdits par la policy 100% Rust). Si on a besoin d'une référence Rust
    # vendored à l'avenir, recréer le dossier ad hoc.
]
# Pivot 2026-05-17 :
# - `google_os`  archivé vers C:\google-os-archive\
# - `bun_ffi`    archivé vers C:\aphrody-archive\ (FFI Bun, pollue le Rust workspace)
# - `n2b`        archivé vers C:\aphrody-archive\ (réintégré via upstream aphrody-code/n2b branche aphrody)
# - `google_kv`  archivé vers C:\aphrody-archive\ (orphan, aucun consumer dans le workspace)
# - `python_ffi` archivé vers C:\aphrody-archive\ (orphan : 0 consumer, dépend de vendor/bun ;
#                AI tuning / MD = candle/comrak en Rust pur, pas besoin de Python bridge)
# Upstreams aphrody intégrés (branche aphrody isolée d'upstream main) :
# - n2b  → https://github.com/aphrody-code/n2b   (Node→Bun linter, 68 rules)
# - bxc  → https://github.com/aphrody-code/bxc   (Bun+Lightpanda browser engine)
# Forks UI/web dans packages/ :
# - ui      → https://github.com/aphrody-code/ui      (fork shadcn-ui/ui)
# - next.js → https://github.com/aphrody-code/next.js (fork vercel/next.js)
# Le projet est `aphrody`, un CLI ultime cross-platform
# (Linux Ubuntu 26.04 > Win11 Canary > wasm).

# ----------------------------------------------------------------------------
# Direct pin: aws-lc-sys 0.41+ ships builder fixes for newer MSVC (VS 2026).
# Declared even if only transitively used, so the resolver picks the newer one.
# ----------------------------------------------------------------------------
[workspace.metadata.aws-lc-sys]
notice = "Forced via cargo update -p aws-lc-sys --precise 0.41.0 if needed."

# ----------------------------------------------------------------------------
# Shared package metadata — inherited via `*.workspace = true`
# ----------------------------------------------------------------------------
[workspace.package]
version      = "1.0.0-canary"
edition      = "2024"
rust-version = "1.97"
authors      = ["aphrody-code"]
homepage     = "https://github.com/aphrody-code/aphrody"
repository   = "https://github.com/aphrody-code/aphrody"
license      = "Apache-2.0"
description  = "aphrody — the ultimate cross-platform CLI (Linux/Windows/WASM)."
keywords     = ["cli", "cross-platform", "rust", "linux", "wasm"]
categories   = ["command-line-utilities", "development-tools", "web-programming"]

# Public-facing URLs propagated to each crate's metadata (visible on
# crates.io / docs.rs). The X handle is the autonomous agent's own
# account (created 2026-05-18) — distinct from the human maintainer.
[workspace.package.metadata.urls]
github = "https://github.com/aphrody-code/aphrody"
x      = "https://x.com/aphrody_code"

# ----------------------------------------------------------------------------
# Centralized dependencies — every crate uses `{ workspace = true }`.
# Caret MAJOR.MINOR; Cargo.lock pins exact patches for reproducibility.
# ----------------------------------------------------------------------------
[workspace.dependencies]
# --- Async runtime & primitives -------------------------------------------
tokio              = { version = "1.52", features = ["full"] }
tokio-stream       = { version = "0.1" }
tokio-rustls       = { version = "0.26" }
futures            = { version = "0.3" }
futures-util       = { version = "0.3" }
async-trait        = { version = "0.1" }
async-stream       = { version = "0.3" }
auto_impl          = { version = "1" }
pin-project-lite   = { version = "0.2" }
crossbeam          = { version = "0.8" }
crossbeam-channel  = { version = "0.5" }
rayon              = { version = "1.12" }

# --- Allocator & FFI ------------------------------------------------------
mimalloc           = { version = "0.1", default-features = false }
libc               = { version = "0.2" }
bytes              = { version = "1" }
memchr             = { version = "2" }
memmap2            = { version = "0.9" }
hashbrown          = { version = "0.14", features = ["inline-more", "raw"] }
allocator-api2     = { version = "0.2", default-features = false, features = ["alloc"] }
smallvec           = { version = "1", features = ["serde", "union", "const_new", "impl_bincode"] }
bumpalo            = { version = "3", features = ["collections", "boxed"] }
typed-arena        = { version = "2" }
scopeguard         = { version = "1" }
self_cell          = { version = "1" }
once_cell          = { version = "1" }
foldhash           = { version = "0.1" }
rustc-hash         = { version = "2" }
itoa               = { version = "1" }

# --- Serde / data formats -------------------------------------------------
serde              = { version = "1", features = ["derive"] }
serde_json         = { version = "1" }
serde_yaml         = { version = "0.9" }
toml               = { version = "0.8" }
bstr               = { version = "1", default-features = false, features = ["alloc"] }
hex                = { version = "0.4" }
base64             = { version = "0.22" }
uuid               = { version = "1", features = ["v4", "v7"] }
semver             = { version = "1" }
chrono             = { version = "0.4", features = ["serde"] }
jiff               = { version = "0.2" }
regex              = { version = "1" }

# --- Logging / errors -----------------------------------------------------
tracing            = { version = "0.1" }
tracing-subscriber = { version = "=0.3.22", features = ["env-filter", "fmt", "json", "regex"] }
anyhow             = { version = "1" }
thiserror          = { version = "2" }
miette             = { version = "7", features = ["fancy"] }

# --- CLI / TUI ------------------------------------------------------------
clap               = { version = "4", features = ["derive", "color", "env"] }
clap_complete      = { version = "4" }
clap_mangen        = { version = "0.2" }
indicatif          = { version = "0.18" }
colored            = { version = "3" }
crossterm          = { version = "0.29" }
ratatui            = { version = "0.30" }

# --- Bitflags / enum-utils ------------------------------------------------
bitflags           = { version = "2" }
enum-map           = { version = "2" }
enumset            = { version = "1" }
strum              = { version = "0.28", features = ["derive"] }
const_format       = { version = "0.2" }
phf                = { version = "0.11", features = ["macros"] }

# --- Filesystem / system --------------------------------------------------
walkdir            = { version = "2" }
fs_extra           = { version = "1" }
globset            = { version = "0.4" }
glob               = { version = "0.3" }
ignore             = { version = "0.4" }
tempfile           = { version = "3" }
terminal_size      = { version = "0.4" }
filetime           = { version = "0.2" }
notify             = { version = "8" }
which              = { version = "8" }
dirs               = { version = "6" }
rustix             = { version = "1.0", default-features = false, features = ["std", "fs", "event", "process", "net"] }

# --- Crypto / security ----------------------------------------------------
aes-gcm            = { version = "0.10" }
argon2             = { version = "0.5" }
sha2               = { version = "0.10" }
sha3               = { version = "0.10" }
md-5               = { version = "0.10" }
blake3             = { version = "1", features = ["rayon"] }
digest             = { version = "0.10" }
zeroize            = { version = "1", features = ["derive"] }
rcgen              = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
rustls             = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile     = { version = "2" }
getrandom          = { version = "0.2" }
rand               = { version = "0.8" }
rand_chacha        = { version = "0.3" }

# --- HTTP / networking ----------------------------------------------------
reqwest            = { version = "0.13", default-features = false, features = ["json", "stream", "charset", "http2", "system-proxy", "rustls-no-provider", "query", "form"] }
http               = { version = "1" }
hyper              = { version = "1" }
axum               = { version = "0.8", default-features = false, features = ["json", "query", "tokio", "http1", "http2"] }
axum-server        = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
tower              = { version = "0.5", features = ["util"] }
tower-http         = { version = "0.6", features = ["cors"] }
dns-lookup         = { version = "2" }
hostname           = { version = "0.4" }
url                = { version = "2" }

# --- aphrody-providers (single-source-of-truth Provider enum) -------------
aphrody-providers  = { path = "crates/aphrody-providers", version = "1.0.0-canary" }

# --- aphrody-embed (local offline text embeddings, fastembed/ONNX) --------
# Default-features off so consumers opt into the heavy `embeddings` feature.
aphrody-embed      = { path = "crates/aphrody-embed", version = "1.0.0-canary", default-features = false }

# `fastembed` declared ONCE here as the single source of truth (CLAUDE.md §2 /
# §5). Pulled only by aphrody-embed behind its `embeddings` feature + a
# `cfg(not(wasm32))` target gate. Default features disabled (they select
# native-tls for the ort backend + hf-hub model download); the rustls variants
# are chosen at the consumer level to honour the rustls-only TLS policy.
# fastembed pins `ort = "=2.0.0-rc.12"` internally — identical to the pin the
# `magika` feature already forces, so `ort` resolves to a single version
# workspace-wide (cargo-deny duplicate-ban clean).
fastembed          = { version = "5.13.4", default-features = false }

# --- notebooklm (Google NotebookLM Boq RPC client) ------------------------
notebooklm         = { path = "crates/notebooklm", version = "1.0.0-canary" }
gemini-web         = { path = "crates/gemini-web", version = "1.0.0-canary" }

# --- aphrody-voice family (TTS + STT) ------------------------------------
aphrody-voice      = { path = "crates/aphrody-voice", version = "1.0.0-canary" }

# --- A2A protocol family --------------------------------------------------
a2a                = { package = "a2a-lf",        path = "crates/a2a",        version = "0.3" }
a2a-client         = { package = "a2a-client-lf", path = "crates/a2a-client", version = "0.1", default-features = false }
a2a-server         = { package = "a2a-server-lf", path = "crates/a2a-server", version = "0.3",  default-features = false }
a2a-pb             = { package = "a2a-pb",        path = "crates/a2a-pb",     version = "0.1" }
a2a-grpc           = { package = "a2a-grpc",      path = "crates/a2a-grpc",   version = "0.2" }
a2a-slimrpc        = { package = "a2a-slimrpc",   path = "crates/a2a-slimrpc", version = "0.1" }
slim_bindings      = { package = "agntcy-slim-bindings", version = "1" }

# --- gRPC / protobuf ------------------------------------------------------
tonic              = { version = "0.14" }
tonic-build        = { version = "0.14" }
tonic-prost        = { version = "0.14" }
tonic-prost-build  = { version = "0.14" }
tonic-tls          = { version = "0.7", default-features = false, features = ["rustls"] }
prost              = { version = "0.14" }
prost-types        = { version = "0.14" }
pbjson             = { version = "0.9" }
pbjson-types       = { version = "0.9" }
pbjson-build       = { version = "0.9" }
protoc-bin-vendored = { version = "3" }

# --- Database -------------------------------------------------------------
rusqlite           = { version = "0.37", features = ["bundled"] }
denokv_sqlite      = { version = "0.13" }
denokv_proto       = { version = "0.13" }
deno_error         = { version = "0.7" }
# LanceDB: serverless vector database, pure Rust + Arrow.  Used by
# aphrody-memory's LanceDB backend (ported from openclaw/extensions/memory-lancedb).
# Pinned matched arrow/arrow-array/arrow-schema versions to keep the
# FixedSizeList vector column compatible with lancedb's expected types.
lancedb            = { version = "0.29", default-features = false }
arrow              = { version = "58" }
arrow-array        = { version = "58" }
arrow-schema       = { version = "58" }

# --- UI / desktop ---------------------------------------------------------
# (Removed dead `wry`/`tao` workspace deps — no crate used them; the desktop
# GUI runs on the pure-Rust winit + wgpu/vello path, avoiding the GTK3 CVE
# surface tao/wry pull on Linux. See best-stack-2026 anti-patterns.)

# --- Python FFI -----------------------------------------------------------
pyo3               = { version = "0.24", features = ["auto-initialize", "abi3-py311"] }

# --- Markdown / docs renderers --------------------------------------------
# `comrak` is the CommonMark/GFM parser used by aphrody-terminal-markdown and
# aphrody-design-material. The `syntect` feature gates code-block highlighting
# (which we pair with `syntect = "5.3"` below). Keep `default-features = false`
# at the consumer level so each crate opts into the syntect bridge explicitly.
comrak             = { version = "0.52", default-features = false }
syntect            = { version = "5.3", default-features = false, features = ["default-fancy"] }

# --- Templating -----------------------------------------------------------
# `minijinja` powers aphrody-prompts: Jinja-compatible template engine, zero
# unsafe, no_std-friendly. Used to render LLM prompts with typed variables
# and reusable partials (`{% include 'name' %}`).
minijinja          = { version = "2", default-features = false, features = ["loader", "builtins", "macros", "multi_template", "deserialization", "serde"] }

# --- XML pull parser ------------------------------------------------------
# `quick-xml` powers the streaming <artifact> block parser in
# aphrody-design-sidecar. Encoding feature carries UTF-16/Latin-1 sniffers.
quick-xml          = { version = "0.36", default-features = false, features = ["encoding"] }

# --- Tokio helpers --------------------------------------------------------
# `tokio-util` codec adapters (FramedRead/Write) backing the ACP newline
# protocol in aphrody-design-agents. `futures-core` is the trait crate the
# spawner's `Stream<Item = AgentEvent>` returns.
tokio-util         = { version = "0.7", features = ["codec"] }
futures-core       = { version = "0.3" }

# --- ID + time primitives -------------------------------------------------
# Crockford-base32 ULIDs (lexicographic sort = creation order, monotonic per
# process). Used by aphrody-design-daemon's project store.
ulid               = { version = "1", features = ["serde"] }
# `time` is a thinner alternative to `chrono` chosen by aphrody-design-daemon
# for `OffsetDateTime` formatting / parsing.
time               = { version = "0.3", features = ["macros", "formatting", "parsing", "serde"] }

# --- 2D vector tessellation + colorimetry ---------------------------------
# `lyon` tessellates rounded-rect / path geometry for aphrody-wgpu-material
# shape primitives. `palette` provides the OKLCH/HCT colour math reused by
# Material Design 3 tonal palettes.
lyon               = { version = "1.0" }
palette            = { version = "0.7", default-features = false, features = ["std"] }

# --- Native windowing + text shaping (wgpu host) --------------------------
# `winit` 0.30 surface-handle API; cosmic-text glyph shaper; `pollster` to
# block on async device init from sync `winit::application::ApplicationHandler`.
# All gated `cfg(not(target_arch = "wasm32"))` at the consumer level.
winit              = { version = "0.30" }
cosmic-text        = { version = "0.19" }
pollster           = { version = "0.3" }

