wasm-bindgen-rayon = "1.3.0"

tracing-wasm       = "0.2"
proc-macro2        = { version = "1" }
quote              = { version = "1" }
syn                = { version = "2", features = ["full", "extra-traits"] }
# ----------------------------------------------------------------------------
# Workspace-wide lints — RFC 3389. Each crate opts-in with `[lints] workspace = true`.
# ----------------------------------------------------------------------------
[workspace.lints.rust]
# --- Critical safety lints (kept strict) ----------------------------------
unsafe_op_in_unsafe_fn         = "deny"
unused_must_use                = "deny"
non_ascii_idents               = "deny"
absolute_paths_not_starting_with_crate = "deny"
keyword_idents                 = { level = "deny", priority = -1 }
ffi_unwind_calls               = "warn"
deprecated_in_future           = "warn"
unused_import_braces           = "warn"
macro_use_extern_crate         = "warn"
non_local_definitions          = "warn"
unreachable_pub                = "warn"
unexpected_cfgs                = "allow"
# --- Style lints (relaxed for FFI / OS-bridge realities) ------------------
# These are too noisy on a workspace bridging POSIX libc, Bun internals,
# Windows-rs raw handles, and PoC kernel emulation. Re-enable per-crate
# (e.g. `crates/base`) once a stylistic pass is done.
missing_debug_implementations  = "allow"
missing_copy_implementations   = "allow"
trivial_numeric_casts          = "allow"
trivial_casts                  = "allow"
unused_lifetimes               = "allow"
unused_qualifications          = "allow"
single_use_lifetimes           = "allow"
elided_lifetimes_in_paths      = "allow"
let_underscore_drop            = "allow"
explicit_outlives_requirements = "allow"
redundant_lifetimes            = "allow"
unused_features                = "allow"

[workspace.lints.rustdoc]
broken_intra_doc_links         = "deny"
private_intra_doc_links        = "warn"
missing_crate_level_docs       = "warn"
invalid_codeblock_attributes   = "warn"
invalid_html_tags              = "warn"
bare_urls                      = "warn"

[workspace.lints.clippy]
# --- Antipatterns kept as deny: leftover debug noise, never legit ---------
todo                           = "deny"
unimplemented                  = "deny"
dbg_macro                      = "deny"
mem_forget                     = "deny"
exit                           = "deny"
lossy_float_literal            = "deny"
float_cmp_const                = "deny"
# --- Group strategy: opt-in per-crate via `#[warn(clippy::pedantic)]` -----
# The workspace-wide deny set above is intentionally tight. Pedantic /
# nursery / style / suspicious / complexity / correctness / perf are all
# `allow` here so they don't fire across FFI / kernel-bridge / Bun-vendor
# code that legitimately violates them. Hardened crates re-enable groups
# in their own `[lints]` table (priority -1 so granular overrides win).
pedantic                       = { level = "allow", priority = -1 }
nursery                        = { level = "allow", priority = -1 }
suspicious                     = { level = "allow", priority = -1 }
style                          = { level = "allow", priority = -1 }
complexity                     = { level = "allow", priority = -1 }
correctness                    = { level = "allow", priority = -1 }
perf                           = { level = "warn",  priority = -1 }
# `cargo` group: muted workspace-wide (publish=false crates lack keywords/categories).
# Enable per-crate once publish=true. Wildcard deps already denied by cargo-deny.
cargo                          = { level = "allow", priority = -1 }
# Selectively re-enable the most impactful cargo lints workspace-wide:
wildcard_dependencies          = "deny"   # version = "*" in published crates
# Explicit allows for lints that still escape group muting (clippy bug
# with priority handling on workspace-inherited tables).
collapsible_if                 = "allow"
collapsible_else_if            = "allow"
collapsible_match              = "allow"

# ============================================================================
# Profiles — production Google-grade. Nightly enables extra LLVM passes.
# ============================================================================

# --- dev: fast iteration, debug info, no LTO -------------------------------
[profile.dev]
opt-level         = 0
debug             = "line-tables-only"
debug-assertions  = true
overflow-checks   = true
lto               = false
codegen-units     = 256
incremental       = true
split-debuginfo   = "unpacked"
panic             = "unwind"

# Heavy build-script deps compiled with optimizations so they don't slow dev.
[profile.dev.build-override]
opt-level         = 3
codegen-units     = 16

# Speed up dev-time deps too (huge win on `cargo check`).
[profile.dev.package."*"]
opt-level         = 1
codegen-units     = 16

# --- release: the default ship target --------------------------------------
[profile.release]
opt-level         = 3
debug             = false
debug-assertions  = false
overflow-checks   = false
lto               = "fat"
codegen-units     = 1
panic             = "abort"
strip             = "symbols"
incremental       = false
rpath             = false
split-debuginfo   = "off"

# --- dist: max-aggression release for binary distribution ------------------
# Used by `cargo build --profile dist`. Adds PGO/BOLT-friendly knobs.
[profile.dist]
inherits          = "release"
opt-level         = 3
lto               = "fat"
codegen-units     = 1
panic             = "abort"
strip             = "symbols"
debug             = false

# --- release-fast: CI-friendly release (parallel codegen) ------------------
[profile.release-fast]
inherits          = "release"
lto               = "thin"
codegen-units     = 16
incremental       = false
strip             = "symbols"

# --- release-debug: prod optimizations + symbols for profiling/`perf` ------
[profile.release-debug]
inherits          = "release"
debug             = "line-tables-only"
strip             = "none"
split-debuginfo   = "packed"

# --- bench: criterion harness ----------------------------------------------
[profile.bench]
inherits          = "release"
debug             = "line-tables-only"
lto               = "thin"
codegen-units     = 16
strip             = "none"

# --- Override: keep heavy crypto fully optimized even in dev profile ------
[profile.dev.package.aes-gcm]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.rustls]
opt-level = 3

# --- sanitizers: AddressSanitizer (nightly) -------------------------------
# Usage: cargo build --profile asan --target x86_64-unknown-linux-gnu
#        (set RUSTFLAGS="-Z sanitizer=address" — handled per-target in
#         .cargo/config.toml when building under this profile)
[profile.asan]
inherits          = "release-debug"
opt-level         = 1
debug             = "full"
lto               = false
codegen-units     = 16

# --- careful: cargo-careful (nightly) — extra UB checks during tests ------
[profile.careful]
inherits          = "dev"
debug-assertions  = true
overflow-checks   = true

# --- reproducible: deterministic dist for binary verification --------------
# Requires SOURCE_DATE_EPOCH env var and --remap-path-prefix (see
# .cargo/config.toml). Same byte-for-byte output across build hosts.
[profile.reproducible]
inherits          = "dist"
codegen-units     = 1
strip             = "symbols"

# --- Size-optimized crates (kept: still in the `aphrody` CLI dep graph) ----
# The browserslist-rs / handlebars / lightningcss* / markdown / mdxjs /
# styled_jsx / swc_* size-opt overrides were removed with the UI extraction
# (2026-05-23): those crates only entered the graph via tuono*/mui-rs*, now in
# C:\src\aphrody-ts. wasmtime + cranelift + regalloc2 stay (still reachable).
[profile.release.package.cranelift-codegen]
opt-level = "s"
[profile.release.package.regalloc2]
opt-level = "s"
[profile.release.package.regex-syntax]
opt-level = "s"
[profile.release.package.reqwest]
opt-level = "s"
[profile.release.package.wasmtime]
opt-level = "s"
[profile.release.package.wasmtime-internal-cranelift]
opt-level = "s"

[patch.crates-io]
bincode = { git = "https://github.com/bgw/bincode.git", branch = "bgw/patches" }
virtue = { git = "https://github.com/bgw/virtue.git", branch = "bgw/fix-generic-default-parsing" }
# mdxjs + include_dir turbopack patches removed with the UI extraction
# (2026-05-23): only the tuono* stack used them (now in C:\src\aphrody-ts).
