# SPDX-License-Identifier: Apache-2.0
[package]
name                   = "aphrody-gateway"
publish                = false
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
homepage.workspace     = true
repository.workspace   = true
license.workspace      = true
description            = "Provider-agnostic OpenAI-compatible AI gateway: Cloudflare AI Gateway, Vercel AI Gateway, and BYOK OpenAI proxy."

[lints]
workspace = true

[dependencies]
async-trait   = { workspace = true }
bytes         = { workspace = true }
dirs          = { workspace = true }
futures       = { workspace = true }
reqwest       = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
thiserror     = { workspace = true }
tokio         = { workspace = true, features = ["rt", "macros", "fs"] }
url           = { workspace = true }
which         = { workspace = true }

[dev-dependencies]
tokio         = { workspace = true, features = ["rt-multi-thread", "macros"] }
serde_json    = { workspace = true }
reqwest       = { workspace = true }
# Install a rustls CryptoProvider in tests before building a reqwest::Client
# (rustls 0.23+ panics "No provider set" otherwise).
rustls        = { workspace = true }

[package.metadata.cargo-machete]
# reqwest features are cfg-gated; keep all declared features from workspace.
ignored = []
