[package]
name = "a2a-grpc"
version = "0.2.2"
description = "A2A v1 gRPC protocol binding for client and server"
readme = "README.md"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace  = true
authors.workspace       = true
homepage.workspace      = true
keywords.workspace      = true
categories.workspace    = true

[lib]
name = "a2a_grpc"

[lints]
workspace = true

[dependencies]
a2a = { workspace = true }
a2a-client = { workspace = true, default-features = false }
a2a-server = { workspace = true, default-features = false }
a2a-pb = { workspace = true }
tonic = { workspace = true }
prost = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true, features = ["net"] }
futures = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
http = { workspace = true }
tokio-rustls    = { workspace = true, optional = true }
tonic-tls       = { workspace = true, optional = true }
rcgen           = { workspace = true, optional = true }
rustls-pemfile  = { workspace = true, optional = true }

[features]
default = ["rustls-tls"]
native-tls = ["a2a-client/native-tls", "a2a-server/native-tls"]
rustls-tls = ["a2a-client/rustls-tls", "a2a-server/rustls-tls"]
rustls = ["dep:tokio-rustls", "dep:tonic-tls", "dep:rcgen", "dep:rustls-pemfile", "rustls-tls"]
