# SPDX-License-Identifier: Apache-2.0
[package]
name                   = "aphrody-images"
publish                = false
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
homepage.workspace     = true
repository.workspace   = true
license.workspace      = true
description            = "Production-grade Nano Banana image generation, editing and composition for aphrody — async concurrent download, typed errors, batch generation, data-URI decode. Surpasses the Python NanoBanana client."

[lints]
workspace = true

[dependencies]
# gemini-web — the Boq RPC client we build on (read-only, no modification).
gemini-web   = { workspace = true }

# Async runtime
tokio        = { workspace = true, features = ["fs", "io-util", "macros", "rt", "time", "sync"] }

# HTTP client for downloading generated image URLs
reqwest      = { workspace = true }

# Serde for typed result structs
serde        = { workspace = true, features = ["derive"] }

# Typed errors
thiserror    = { workspace = true }

# base64 for data-URI decode
base64       = { workspace = true }

# Tracing
tracing      = { workspace = true }

[dev-dependencies]
tokio        = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
tempfile     = { workspace = true }
rustls       = { workspace = true }

[package.metadata.cargo-machete]
# tracing: macro-only usage (tracing::debug!/warn!); machete under-counts macros.
ignored = ["tracing"]
