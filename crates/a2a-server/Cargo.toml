[package]
name = "a2a-server-lf"
publish = true
version = "0.3.0"
description = "A2A v1 async server framework"
readme = "README.md"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace  = true
authors.workspace       = true
homepage.workspace      = true
keywords.workspace      = true
categories.workspace    = true

[lib]
name = "a2a_server"

[lints]
workspace = true

[dependencies]
a2a = { workspace = true }
a2a-pb = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
hyper = { workspace = true }
reqwest = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
rustls = { workspace = true, optional = true, features = ["ring"] }
axum-server = { workspace = true, optional = true }

[features]
default = ["rustls-tls"]
native-tls = ["reqwest/native-tls"]
rustls-tls = ["reqwest/rustls-no-provider", "dep:rustls", "dep:axum-server"]
rustls = ["dep:rustls", "rustls-tls"]

[dev-dependencies]
http-body-util = "0.1"

# hyper, tower-http, tokio-stream: explicit version pins for axum's transitive
# deps. None are directly imported via `use` — they are resolved through axum's
# re-exports. machete cannot detect transitive pin usage; suppress false positives.
[package.metadata.cargo-machete]
ignored = ["hyper", "tower-http", "tokio-stream"]
