# SPDX-License-Identifier: Apache-2.0
[package]
name                   = "aphrody-skills"
publish                = false
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
homepage.workspace     = true
repository.workspace   = true
license.workspace      = true
description            = "Unified skills infrastructure: SKILL.md runtime + lifecycle hooks + tool-level permissions."

[lints]
workspace = true

[[bin]]
name = "aphrody-skills"
path = "src/runtime/bin/agent_skills.rs"

[dependencies]
# --- shared ---
serde      = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror  = { workspace = true }
tracing    = { workspace = true }

# --- runtime-specific ---
anyhow     = { workspace = true }
clap       = { workspace = true }
serde_yaml = { workspace = true }
walkdir    = { workspace = true }
dirs       = { workspace = true }
tempfile   = { workspace = true }

# --- hooks-specific ---
tokio      = { workspace = true, features = ["macros", "rt", "process", "io-util", "time", "sync", "fs"] }
globset    = { workspace = true }

# --- permissions-specific ---
glob       = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
serde_json = { workspace = true }
tokio    = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "process", "io-util", "time", "sync", "fs", "test-util"] }

[package.metadata.cargo-machete]
# tracing is now detected as used by machete -- removed from ignored 2026-05-21.
ignored = []
