# SPDX-License-Identifier: Apache-2.0
[package]
name                   = "aphrody-wgpu-material"
publish                = false
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
homepage.workspace     = true
repository.workspace   = true
license.workspace      = true
description            = "Material Design 3 component library rendered on wgpu (WebGPU)."

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
default = []
# When enabled, pulls design tokens from the workspace `m3-tokens` crate via a
# path dependency injected by the parent build instead of using the bundled
# `m3_tokens` baseline. Off by default so the crate stays self-contained.
external-tokens = []

[dependencies]
wgpu      = { workspace = true }
bytemuck  = { workspace = true }
lyon      = { workspace = true }
palette   = { workspace = true }
anyhow    = { workspace = true }
thiserror = { workspace = true }
tracing   = { workspace = true }

# Native-only deps (winit window + cosmic-text glyph rendering). Gated off for
# wasm32-unknown-unknown so `cargo check --target wasm32-unknown-unknown` stays
# clean (cf. CLAUDE.md §0 cible #3).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
winit       = { workspace = true }
cosmic-text = { workspace = true }
pollster    = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[example]]
name = "showcase"
path = "examples/showcase.rs"
required-features = []

[package.metadata.docs.rs]
all-features = true

# cargo-machete: `cosmic-text` is currently consumed only via runtime glyph
# rendering wired through a future `glyphon` bridge (see src/canvas.rs notes);
# keep the explicit ignore until the bridge lands.
[package.metadata.cargo-machete]
ignored = ["cosmic-text"]
