# SPDX-License-Identifier: Apache-2.0
[package]
name                   = "aphrody-terminal-llm"
publish                = false
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
homepage.workspace     = true
repository.workspace   = true
license.workspace      = true
description            = "LLM event bus and multiplexer layer for aphrody-terminal (sub-agents, MCP, hooks, skills, tasks)."

[lints]
workspace = true

[features]
# Gate the default-server discovery helpers (google_mcp binary detection, bxc
# stdio wiring) and the `which` dep behind this feature so the core event-bus
# crate stays lean when only the bare EventBus/McpStatusRegistry types are needed.
default = ["mcp-default-servers"]
mcp-default-servers = ["dep:which", "dep:aphrody-mcp"]

[dependencies]
serde         = { workspace = true }
serde_json    = { workspace = true }
tokio         = { workspace = true, features = ["sync", "rt", "macros", "process", "io-util", "time"] }
anyhow        = { workspace = true }
tracing       = { workspace = true }
base64        = { workspace = true }

# reqwest: HTTP probe for McpTransport::Http servers.
reqwest       = { workspace = true }

# Config shim source-of-truth: import_mcp_json + McpShim live in terminal-config.
# This crate adapts McpShim into the McpServerSpec / McpTransport surface used by
# the probe loop (avoids duplicating the .mcp.json parser, T6 dedup lane).
aphrody-terminal-config = { path = "../aphrody-terminal-config" }

# OSC envelope strip is canonical in aphrody-terminal-vt (T6 dedup lane).
# The vt crate owns the framing because it is the layer that produces OSC.
aphrody-terminal-vt     = { path = "../aphrody-terminal-vt" }

# Docs preview pane: invokes aphrody-summary::generate() in-process to
# render docs/SUMMARY.md inline (matrix row T-INT-summary).
aphrody-summary         = { path = "../aphrody-summary" }

# Session memory pane: durable JSONL store + brute-force cosine recall for
# past terminal commands / sub-agent transcripts (matrix row T-INT-memory).
aphrody-memory          = { path = "../aphrody-memory" }

# Optional — pulled in by feature `mcp-default-servers`.
which         = { workspace = true, optional = true }
aphrody-mcp   = { path = "../aphrody-mcp", optional = true }

[dev-dependencies]
tokio    = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
tempfile = { workspace = true }

[package.metadata.cargo-machete]
# aphrody-mcp: optional dep behind feature `mcp-default-servers`; machete
# cannot resolve optional dep usage and incorrectly flags it as unused.
ignored = ["aphrody-mcp"]
