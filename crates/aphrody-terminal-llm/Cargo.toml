# SPDX-License-Identifier: Apache-2.0
[package]
name                   = "aphrody-terminal-llm"
publish                = false
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
homepage.workspace     = true
repository.workspace   = true
license.workspace      = true
description            = "LLM event bus and multiplexer layer for aphrody-terminal (sub-agents, MCP, hooks, skills, tasks)."

[lints]
workspace = true

[features]
# Gate the default-server discovery helpers (google_mcp binary detection, bxc
# stdio wiring) and the `which` dep behind this feature so the core event-bus
# crate stays lean when only the bare EventBus/McpStatusRegistry types are needed.
default = ["mcp-default-servers"]
mcp-default-servers = ["dep:which", "dep:aphrody-mcp"]

[dependencies]
serde         = { workspace = true }
serde_json    = { workspace = true }
tokio         = { workspace = true, features = ["sync", "rt", "macros", "process", "io-util", "time"] }
anyhow        = { workspace = true }
tracing       = { workspace = true }
base64        = { workspace = true }
thiserror     = { workspace = true }

# reqwest: HTTP probe for McpTransport::Http servers.
reqwest       = { workspace = true }

# Optional — pulled in by feature `mcp-default-servers`.
which         = { workspace = true, optional = true }
aphrody-mcp   = { path = "../aphrody-mcp", optional = true }

[dev-dependencies]
tokio    = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
tempfile = { workspace = true }
