# SPDX-License-Identifier: Apache-2.0
[package]
name                   = "aphrody-retry"
publish                = false
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
homepage.workspace     = true
repository.workspace   = true
license.workspace      = true
description            = "Reusable retry primitives (exponential backoff, jitter modes, classifier trait, Retry-After honoring) for HTTP API calls inside the aphrody workspace."

[lints]
workspace = true

[dependencies]
serde       = { workspace = true, features = ["derive"] }
serde_json  = { workspace = true }
thiserror   = { workspace = true }
tracing     = { workspace = true }
async-trait = { workspace = true }
tokio       = { workspace = true, features = ["time", "macros", "rt"] }
rand        = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "time", "macros", "rt", "rt-multi-thread"] }

[package.metadata.cargo-machete]
# tracing is consumed through macros only; async-trait is exported in the
# `RetryClassifier` impl surface; keep both explicit so machete does not
# misfire when downstreams depend on us via re-exports only.
ignored = ["tracing", "async-trait"]
