[package]
name                   = "aphrody-terminal-json-out"
publish                = false
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
homepage.workspace     = true
repository.workspace   = true
license.workspace      = true
description            = "Frame child-process stdout/stderr into JSONL envelopes with app-JSON passthrough for aphrody-terminal."

[lints]
workspace = true

[dependencies]
serde         = { workspace = true }
serde_json    = { workspace = true }
tokio         = { workspace = true, features = ["rt", "macros", "io-util", "sync", "process"] }
base64        = { workspace = true }
chrono        = { workspace = true }
thiserror     = { workspace = true }

[dev-dependencies]
tokio   = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "io-util", "sync", "process", "time"] }
regex   = { workspace = true }

[package.metadata.cargo-machete]
ignored = []
