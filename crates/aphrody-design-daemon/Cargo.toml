# SPDX-License-Identifier: Apache-2.0
[package]
name                   = "aphrody-design-daemon"
publish                = false
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
homepage.workspace     = true
repository.workspace   = true
license.workspace      = true
description            = "SQLite project store + design-systems registry daemon (Rust port of open-design daemon)."

[lints]
workspace = true

[lib]
name = "aphrody_design_daemon"
path = "src/lib.rs"

[[bin]]
name = "aphrody-design-daemon"
path = "src/bin/main.rs"

[dependencies]
# --- SQLite (bundled = static libsqlite3, hermetic cross-platform) ---------
rusqlite           = { workspace = true }

# --- serde / formats -------------------------------------------------------
serde              = { workspace = true }
serde_json         = { workspace = true }

# --- errors ----------------------------------------------------------------
anyhow             = { workspace = true }
thiserror          = { workspace = true }

# --- CLI -------------------------------------------------------------------
clap               = { workspace = true }

# --- Async runtime (light: hosts blocking SQLite via spawn_blocking) -------
tokio              = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "signal", "time"] }

# --- tracing ---------------------------------------------------------------
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }

# --- IDs + time ------------------------------------------------------------
# ULID gives lexicographically-sortable 26-char IDs whose first 48 bits
# encode the creation timestamp — matches open-design's ORDER BY created_at
# sort semantics without an extra index, and is monotonic per process.
ulid               = { workspace = true }
time               = { workspace = true }

# --- filesystem ------------------------------------------------------------
dirs               = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
