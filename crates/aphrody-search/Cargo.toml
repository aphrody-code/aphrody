# SPDX-License-Identifier: Apache-2.0
[package]
name                   = "aphrody-search"
publish                = false
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
homepage.workspace     = true
repository.workspace   = true
license.workspace      = true
description            = "In-memory full-text search: tokenizer, inverted index, BM25-lite scoring, snippet highlighting, atomic JSON persistence."

[lints]
workspace = true

[dependencies]
serde      = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror  = { workspace = true }
tracing    = { workspace = true }
tokio      = { workspace = true, features = ["fs", "io-util", "macros", "rt"] }
chrono     = { workspace = true, features = ["serde"] }
regex      = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio    = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "fs", "io-util"] }

[package.metadata.cargo-machete]
# `tracing` and `regex` are used through macro / lazy paths; keep them
# explicit so machete doesn't strip them when callers disable log capture
# or skip the tokenizer regex fast-path.
ignored = ["tracing", "regex"]
