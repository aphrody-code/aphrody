[package]
name                   = "aphrody-ocr-vlm"
publish                = false
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
homepage.workspace     = true
repository.workspace   = true
license.workspace      = true
description            = "llama.cpp VLM backends for Aphrody OCR: one-shot and resident document transcription."

[lib]
crate-type = ["rlib"]

[lints]
workspace = true

[dependencies]
aphrody-infer     = { workspace = true }
aphrody-models    = { workspace = true }
aphrody-ocr-core  = { workspace = true }
reqwest           = { workspace = true, features = ["blocking"] }
rustls            = { workspace = true }
serde             = { workspace = true }
serde_json        = { workspace = true }
thiserror         = { workspace = true }
tracing           = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
