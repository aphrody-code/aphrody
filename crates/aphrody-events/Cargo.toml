# SPDX-License-Identifier: Apache-2.0
[package]
name                   = "aphrody-events"
publish                = false
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
homepage.workspace     = true
repository.workspace   = true
license.workspace      = true
description            = "In-process async event bus for aphrody — broadcast + topic filtering + NDJSON audit sink, no external broker required."

[lints]
workspace = true

[dependencies]
serde       = { workspace = true, features = ["derive"] }
serde_json  = { workspace = true }
thiserror   = { workspace = true }
tracing     = { workspace = true }
async-trait = { workspace = true }
chrono      = { workspace = true }
tokio       = { workspace = true, features = ["sync", "macros", "rt", "fs", "io-util", "time"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio    = { workspace = true, features = ["sync", "macros", "rt", "rt-multi-thread", "fs", "io-util", "time", "test-util"] }

[package.metadata.cargo-machete]
# tracing is consumed via macros (debug!/warn!) only.
ignored = ["tracing"]
