# SPDX-License-Identifier: Apache-2.0
[package]
name                   = "aphrody-telemetry"
publish                = false
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
homepage.workspace     = true
repository.workspace   = true
license.workspace      = true
description            = "In-process observability for aphrody — hierarchical spans, monotonic counters, bucketed histograms, NDJSON exporter. OpenTelemetry-inspired, zero OTLP weight."

[lints]
workspace = true

[dependencies]
serde       = { workspace = true, features = ["derive"] }
serde_json  = { workspace = true }
thiserror   = { workspace = true }
tracing     = { workspace = true }
async-trait = { workspace = true }
chrono      = { workspace = true }
parking_lot = { workspace = true }
tokio       = { workspace = true, features = ["fs", "io-util", "macros", "rt", "sync", "time"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio    = { workspace = true, features = ["fs", "io-util", "macros", "rt", "rt-multi-thread", "sync", "time"] }

[package.metadata.cargo-machete]
# `tracing` and `async-trait` are consumed via macros / trait attribute that
# can register as unused under strict scans; keep them explicit.
ignored = ["tracing", "async-trait"]
