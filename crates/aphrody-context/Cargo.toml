# SPDX-License-Identifier: Apache-2.0
[package]
name                   = "aphrody-context"
publish                = false
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
homepage.workspace     = true
repository.workspace   = true
license.workspace      = true
description            = "LLM context-window manager — heuristic token counting, sliding-window trim with pinned-message preservation, summarization triggers, and JSON snapshot/restore."

[lints]
workspace = true

[dependencies]
serde      = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror  = { workspace = true }
tracing    = { workspace = true }
chrono     = { workspace = true, features = ["serde"] }

[package.metadata.cargo-machete]
# tracing is consumed via macros only; keep it explicit so machete doesn't
# misfire under conditional compilation.
ignored = ["tracing"]
