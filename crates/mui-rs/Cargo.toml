[package]
name = "mui-rs"
description = "Material Design 3 native UI library for Rust — GPU-accelerated, cross-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
default    = ["desktop"]
desktop    = ["winit", "mui-rs-renderer/desktop", "dark-light"]
web        = ["mui-rs-renderer/web", "mui-rs-components/wasm"]
android    = ["mui-rs-renderer/android", "android-activity"]
plugins    = ["wasmtime", "wit-bindgen", "wasmparser", "walrus"]
js-runtime = ["rquickjs"]

[dependencies]
# Re-exported sub-crates (this umbrella only re-exports; no direct logic deps).
m3-tokens     = { path = "../m3-tokens" }
mui-rs-renderer   = { path = "../mui-rs-renderer" }
mui-rs-motion     = { path = "../mui-rs-motion" }
mui-rs-components = { path = "../mui-rs-components" }

# desktop
winit      = { workspace = true, optional = true }
dark-light = { workspace = true, optional = true }

# android
android-activity = { workspace = true, optional = true }

# WASM host / plugins
wasmtime    = { workspace = true, optional = true }
wit-bindgen = { workspace = true, optional = true }
wasmparser  = { workspace = true, optional = true }
walrus      = { workspace = true, optional = true }

# JS engine
rquickjs = { workspace = true, optional = true }

[dev-dependencies]
criterion.workspace = true
insta.workspace = true
# For the m3_showcase example (native winit window + wgpu/vello render loop).
winit    = { workspace = true }
pollster = { workspace = true }

# Optional deps wired purely through [features] (desktop/android/plugins/
# js-runtime); not referenced in this umbrella crate's own source, so machete
# false-flags them.
[package.metadata.cargo-machete]
ignored = ["winit", "dark-light", "android-activity", "wasmtime", "wit-bindgen", "wasmparser", "walrus", "rquickjs"]
