# SPDX-License-Identifier: Apache-2.0
[package]
name                   = "aphrody-permissions"
publish                = false
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
homepage.workspace     = true
repository.workspace   = true
license.workspace      = true
description            = "Tool-level permission engine (allow/deny/ask + glob matchers + settings.json compatibility) shared across aphrody runtime, hooks, MCP and skills."

[lints]
workspace = true

[dependencies]
serde      = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror  = { workspace = true }
glob       = { workspace = true }
regex      = { workspace = true }
tracing    = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[package.metadata.cargo-machete]
# `tracing` is consumed only via debug! / trace! macros; keep it pinned so
# downstream consumers can attach a subscriber without churn.
ignored = ["tracing"]
