# SPDX-License-Identifier: Apache-2.0
[package]
name                   = "aphrody-messaging"
publish                = false
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
homepage.workspace     = true
repository.workspace   = true
license.workspace      = true
description            = "Tier-1 messaging connectors (Telegram Bot API, Slack Web API, native SMTP)."

[lints]
workspace = true

[dependencies]
tokio        = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "net", "time", "sync"] }
reqwest      = { workspace = true, features = ["multipart"] }
serde        = { workspace = true, features = ["derive"] }
serde_json   = { workspace = true }
async-trait  = { workspace = true }
thiserror    = { workspace = true }
base64       = { workspace = true }
url          = { workspace = true }
uuid         = { workspace = true }
tracing      = { workspace = true }
chrono       = { workspace = true }
bytes        = { workspace = true }
gethostname  = "1.1"
# --- channels deps (merged from aphrody-channels) ---
async-stream = { workspace = true }
futures      = { workspace = true }
tokio-stream = { workspace = true }

# Native SMTP TLS — gated to non-wasm targets (SMTP needs raw sockets).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio-rustls = { workspace = true }
rustls       = { workspace = true, features = ["ring"] }
webpki-roots = "1"

[dev-dependencies]
tokio        = { workspace = true, features = ["rt-multi-thread", "macros", "test-util", "io-util", "net", "time", "sync"] }
serde_json   = { workspace = true }
tempfile     = { workspace = true }
axum         = { workspace = true }
hyper        = { workspace = true, features = ["server", "http1"] }
hyper-util   = { version = "0.1", features = ["server-auto", "tokio"] }
tower        = { workspace = true }
rustls       = { workspace = true, features = ["ring"] }

[package.metadata.cargo-machete]
ignored = ["bytes", "rustls", "webpki-roots"]
