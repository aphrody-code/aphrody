# registry/globals.toml — globals Node (CJS / ESM) à part entière.
#
# Phase 4 : surface complète des globals Node — chacun a son équivalent Bun
# et sa stratégie de réécriture. Détecté par l'AST oxc (pas de regex
# textuelle — un identifier `process` peut être local).
#
# Phase 5 ajoute le câblage `--migrate` sur les `template`. Phase 6 ajoute
# `globals/require-dynamic` (si dynamic_requires non vide dans l'ImportGraph).

[[globals]]
id           = "globals/__dirname"
symbol       = "__dirname"
bun          = "import.meta.dir"
context      = "esm"
rewrite      = "template"
template     = "import.meta.dir"
severity     = "warn"
docs         = "https://bun.sh/docs/api/import-meta"

[[globals]]
id           = "globals/__filename"
symbol       = "__filename"
bun          = "import.meta.path"
context      = "esm"
rewrite      = "template"
template     = "import.meta.path"
severity     = "warn"
docs         = "https://bun.sh/docs/api/import-meta"

[[globals]]
id           = "globals/process-cwd"
symbol       = "process.cwd"
bun          = "process.cwd()"
context      = "any"
rewrite      = "manual"
codemod_hint = "process.cwd() est supporté nativement par Bun — pas de réécriture nécessaire (entrée présente pour compat audit)"
severity     = "info"
docs         = "https://bun.sh/docs/runtime/process"

[[globals]]
id           = "globals/process-platform"
symbol       = "process.platform"
bun          = "process.platform"
context      = "any"
rewrite      = "manual"
codemod_hint = "process.platform est natif Bun — préférer process.platform à os.platform() (pas d'import 'os' nécessaire)"
severity     = "info"
docs         = "https://bun.sh/docs/runtime/process"

[[globals]]
id           = "globals/process-argv"
symbol       = "process.argv"
bun          = "Bun.argv"
context      = "any"
rewrite      = "manual"
codemod_hint = "Bun.argv est l'équivalent Bun-natif de process.argv (alias plus court)"
severity     = "info"
docs         = "https://bun.sh/docs/api/utils#bun-argv"

[[globals]]
id           = "globals/process-env"
symbol       = "process.env"
bun          = "Bun.env"
context      = "any"
rewrite      = "manual"
codemod_hint = "Bun.env est l'équivalent Bun-natif de process.env (alias plus court)"
severity     = "info"
docs         = "https://bun.sh/docs/api/utils#bun-env"

[[globals]]
id           = "globals/module-exports"
symbol       = "module.exports"
bun          = "export"
context      = "cjs"
rewrite      = "manual"
codemod_hint = "module.exports = X → export default X (ou named exports selon le pattern). Conversion CJS→ESM nécessite contexte"
severity     = "warn"
docs         = "https://bun.sh/docs/runtime/modules"

[[globals]]
id           = "globals/exports"
symbol       = "exports"
bun          = "export"
context      = "cjs"
rewrite      = "manual"
codemod_hint = "exports.X = ... → export const X = ... (CJS → ESM)"
severity     = "warn"
docs         = "https://bun.sh/docs/runtime/modules"

[[globals]]
id           = "globals/require-dynamic"
symbol       = "require"
bun          = "await import"
context      = "dynamic-arg"
rewrite      = "manual"
codemod_hint = "require(<expr>) avec argument variable — convertir en `await import(<expr>)` et marquer l'envrionnement async (top-level await accepté en Bun ESM)"
severity     = "warn"
docs         = "https://bun.sh/docs/runtime/modules"
