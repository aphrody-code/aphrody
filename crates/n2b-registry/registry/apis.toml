# registry/apis.toml — patterns d'appel API/méthode Node → réécriture Bun.
#
# Phase 1 : transcription mécanique des entrées de
#   crates/n2b-rules/src/bun_apis.rs::RULES
# Une entrée = un appel `rule(...)` ou `info_rule(...)`. La sévérité Info
# vient de `info_rule`, sinon c'est `Warn`. Ordre identique à la source.

[[apis]]
id          = "api/fs-readFileSync"
pattern     = "\\bfs\\.readFileSync\\s*\\(\\s*([^,)]+?)\\s*,\\s*['\"]utf-?8['\"]\\s*\\)"
message     = "remplacer fs.readFileSync(path, 'utf8') par await Bun.file(path).text()"
severity    = "warn"
replace     = "template"
replacement = "await Bun.file($1).text()"
aggressive  = true

[[apis]]
id          = "api/fs-writeFileSync"
pattern     = '\bfs\.writeFileSync\s*\(\s*([^,]+?)\s*,\s*([^)]+?)\s*\)'
message     = "remplacer fs.writeFileSync(path, data) par await Bun.write(path, data)"
severity    = "warn"
replace     = "template"
replacement = "await Bun.write($1, $2)"
aggressive  = true

[[apis]]
id          = "api/process-env"
pattern     = '\bprocess\.env\.([A-Z_][A-Z0-9_]*)\b'
message     = "Bun.env est un alias plus court de process.env (préférence stylistique)"
severity    = "info"
replace     = "none"
aggressive  = false

[[apis]]
id          = "api/dirname-esm"
pattern     = '\b(?:const|let|var)\s+__dirname\s*=\s*(?:path\.)?dirname\s*\(\s*fileURLToPath\s*\(\s*import\.meta\.url\s*\)\s*\)'
message     = "dans un ESM Bun, utiliser directement import.meta.dir (ou import.meta.dirname)"
severity    = "warn"
replace     = "static"
replacement = "const __dirname = import.meta.dir"
aggressive  = true

[[apis]]
id          = "api/filename-esm"
pattern     = '\b(?:const|let|var)\s+__filename\s*=\s*fileURLToPath\s*\(\s*import\.meta\.url\s*\)'
message     = "dans un ESM Bun, utiliser import.meta.path (ou import.meta.filename)"
severity    = "warn"
replace     = "static"
replacement = "const __filename = import.meta.path"
aggressive  = true

[[apis]]
id          = "api/express-server"
import_from = "express"
pattern     = "\\b(?:const|let|var)\\s+(\\w+)\\s*=\\s*require\\(\\s*['\"]express['\"]\\s*\\)\\s*\\(\\s*\\)"
message     = "envisager Bun.serve() plutôt qu'Express pour un serveur simple (voir runtime/http)"
severity    = "warn"
replace     = "none"
aggressive  = false

