# registry/modules.toml — modules `node:*` reconnus par n2b.
#
# Phase 1 : transcription des 47 entrées de
#   crates/n2b-rules/src/node_imports.rs::BUILTINS
# Aucun champ `compat`/`severity` saisi à ce stade — la dérivation arrive
# en Phase 3 ; ici on liste juste les modules pour préserver la sortie
# octet-identique de `imports/node-prefix`.
#
# Ordre identique à la source Rust pour faciliter le diff.


