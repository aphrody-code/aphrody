# ─────────────────────────────────────────────────────────────────────────────
# Section : SDKs agent-to-agent (A2A) + Model Context Protocol (MCP).
# Mapping informationnel npm → crate Rust pour les projets qui veulent un
# binaire natif performant ou intégrer A2A/MCP côté serveur sans dep Node.
# `aggressive = false` : juste de l'info, pas de réécriture automatique.
# ─────────────────────────────────────────────────────────────────────────────

[[packages]]
id          = "imports/rust-sdk-alt"
package     = "@a2a-js/sdk"
replacement = "a2a-rs"
note        = "SDK Rust officiel pour Agent2Agent. https://github.com/a2aproject/a2a-rs — préférable si tu construis un service standalone natif (gain perf + cdylib via napi-rs / FFI Bun)."
aggressive  = false

[[packages]]
id          = "imports/rust-sdk-alt"
package     = "@drew-foxall/a2a-js-sdk"
replacement = "a2a-rs"
note        = "Fork Bun-native du SDK A2A — l'équivalent Rust est https://github.com/a2aproject/a2a-rs (workspace, async tokio)."
aggressive  = false

[[packages]]
id          = "imports/rust-sdk-alt"
package     = "@modelcontextprotocol/sdk"
replacement = "rmcp"
note        = "SDK Rust officiel pour le Model Context Protocol. https://github.com/modelcontextprotocol/rust-sdk — workspace Cargo, transports stdio + HTTP+SSE + WebSocket, idéal pour serveurs MCP performants."
aggressive  = false

# ─────────────────────────────────────────────────────────────────────────────
# Section : écosystème Tokio (https://github.com/tokio-rs) — alternatives
# Rust natives aux libs async Node les plus communes. Pertinent quand on
# build un service standalone perf-critical (broker A2A/MCP, gRPC, edge
# proxy) plutôt que d'empiler du Node sur Bun. `aggressive = false`.
# ─────────────────────────────────────────────────────────────────────────────

[[packages]]
id          = "imports/rust-sdk-alt"
package     = "express"
replacement = "axum"
note        = "Framework web async basé sur hyper + tower. https://github.com/tokio-rs/axum — extracteurs typés, middleware composable, perf >100k req/s en mono-core."
aggressive  = false

[[packages]]
id          = "imports/rust-sdk-alt"
package     = "fastify"
replacement = "axum"
note        = "https://github.com/tokio-rs/axum — équivalent Rust de l'approche perf-first de Fastify (router radix + tower middleware)."
aggressive  = false

[[packages]]
id          = "imports/rust-sdk-alt"
package     = "koa"
replacement = "axum"
note        = "https://github.com/tokio-rs/axum — chaîne middleware tower équivalente à l'idiome compose Koa."
aggressive  = false

[[packages]]
id          = "imports/rust-sdk-alt"
package     = "@grpc/grpc-js"
replacement = "tonic"
note        = "https://github.com/hyperium/tonic — client/serveur gRPC Rust async sur hyper + prost. Compatible proto3, streaming bidi natif."
aggressive  = false

[[packages]]
id          = "imports/rust-sdk-alt"
package     = "protobufjs"
replacement = "prost"
note        = "https://github.com/tokio-rs/prost — codegen + runtime protobuf Rust. Sortie idiomatic Rust, derive Serialize/Deserialize."
aggressive  = false

[[packages]]
id          = "imports/rust-sdk-alt"
package     = "ws"
replacement = "tokio-tungstenite"
note        = "https://github.com/snapview/tokio-tungstenite — WebSocket client + serveur sur tokio. Compatible RFC 6455, perf comparable."
aggressive  = false

[[packages]]
id          = "imports/rust-sdk-alt"
package     = "axios"
replacement = "reqwest"
note        = "https://github.com/seanmonstar/reqwest — client HTTP sur hyper + tokio. JSON helper, cookies, multipart, async + blocking."
aggressive  = false

[[packages]]
id          = "imports/rust-sdk-alt"
package     = "pino"
replacement = "tracing"
note        = "https://github.com/tokio-rs/tracing — instrumentation structurée (spans + events) avec subscribers JSON/console. Plus puissant qu'un logger plat type pino."
aggressive  = false

[[packages]]
id          = "imports/rust-sdk-alt"
package     = "winston"
replacement = "tracing"
note        = "https://github.com/tokio-rs/tracing — équivalent Rust avec spans hiérarchiques. Subscribers : tracing-subscriber, OpenTelemetry."
aggressive  = false

[[packages]]
id          = "imports/rust-sdk-alt"
package     = "bullmq"
replacement = "tokio + redis-rs"
note        = "Pas de drop-in 1:1 — l'équivalent Rust idiomatique est tokio comme runtime + https://github.com/redis-rs/redis-rs pour Redis async + un worker custom (~50 LOC)."
aggressive  = false

# ─────────────────────────────────────────────────────────────────────────────
# Section : Leptos (https://github.com/leptos-rs/leptos) — framework full-stack
# Rust (signals + hydration SSR + server functions). Alternative à React/Next.js
# pour projets où on veut un binaire natif compilé, déployable sans Node runtime.
# Pair idiomatique avec axum côté serveur + hydratation client via WASM.
# ─────────────────────────────────────────────────────────────────────────────

[[packages]]
id          = "imports/rust-sdk-alt"
package     = "react"
replacement = "leptos"
note        = "https://github.com/leptos-rs/leptos — framework Rust reactive (signals fine-grained, pas de VDOM). SSR + CSR + hydration intégrés."
aggressive  = false

[[packages]]
id          = "imports/rust-sdk-alt"
package     = "react-dom"
replacement = "leptos (intégré)"
note        = "Hydration et rendu DOM gérés nativement par leptos via leptos_dom / wasm-bindgen — pas de package séparé."
aggressive  = false

[[packages]]
id          = "imports/rust-sdk-alt"
package     = "next"
replacement = "leptos + axum"
note        = "https://github.com/leptos-rs/leptos + https://github.com/tokio-rs/axum — équivalent Next.js : SSR via integration leptos_axum, server functions typées, file-based routing via leptos_router. Déploiement standalone binary (Fly.io / Shuttle / Cloudflare Workers WASM)."
aggressive  = false

[[packages]]
id          = "imports/rust-sdk-alt"
package     = "@tanstack/react-router"
replacement = "leptos_router"
note        = "Router fourni par l'écosystème Leptos — composants <Route>, <A>, hooks use_params/use_query, nested layouts. https://docs.rs/leptos_router"
aggressive  = false

[[packages]]
id          = "imports/rust-sdk-alt"
package     = "@tanstack/react-query"
replacement = "leptos resources / server functions"
note        = "Leptos a un primitive natif `create_resource()` (signals async) qui couvre le data-fetching cache pattern de react-query. Combiné avec server functions (#[server]) pour le SSR fetch."
aggressive  = false

[[packages]]
id          = "imports/rust-sdk-alt"
package     = "zod"
replacement = "serde + validator"
note        = "https://github.com/serde-rs/serde + https://github.com/Keats/validator — validation déclarative via derive macros. Plus puissant car type-safe à la compile."
aggressive  = false

[[packages]]
id          = "imports/rust-sdk-alt"
package     = "prisma"
replacement = "sqlx ou diesel ou sea-orm"
note        = "Pas d'équivalent 1:1 — choix : sqlx (https://github.com/launchbadge/sqlx, async, type-checked SQL à la compile), diesel (sync, mature), ou sea-orm (active-record + migrations). Pour stack tokio + axum + leptos → sqlx idiomatique."
aggressive  = false

[[packages]]
id          = "imports/rust-sdk-alt"
package     = "drizzle-orm"
replacement = "sqlx"
note        = "https://github.com/launchbadge/sqlx — query builder + raw SQL type-checked à la compile via macro query!(). Bindings Postgres/MySQL/SQLite. Plus proche philosophiquement de Drizzle (SQL-first) que diesel (DSL)."
aggressive  = false
