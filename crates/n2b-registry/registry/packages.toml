# registry/packages.toml — deps npm avec leur stratégie de remplacement Bun.
#
# Phase 1 : transcription mécanique des entrées de
#   crates/n2b-rules/src/node_imports.rs::BUN_REPLACEMENTS
# Toutes partagent le Rule ID `imports/bun-native`. Le `package` est unique.
# Ordre identique à la source Rust pour faciliter le diff.

[[packages]]
id          = "imports/bun-native"
package     = "sqlite3"
replacement = "bun:sqlite"
note        = "préférer bun:sqlite (natif, synchrone, rapide)"
aggressive  = true

