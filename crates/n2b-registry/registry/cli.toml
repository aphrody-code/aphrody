# bare yarn at start of line → bun install (preserve leading ws)
[[cli]]
id      = "cli/yarn-bare"
pattern = '(?m)^(\s*)yarn(\s|$)'
replace = "${1}bun install${2}"
message = "bare `yarn` → bun install"
