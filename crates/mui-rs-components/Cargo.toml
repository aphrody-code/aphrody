[package]
name = "mui-rs-components"
description = "M3 component library — 36+ Material Design 3 components (native GPU)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
default = []
wasm    = ["mui-rs-renderer/web", "wasm-bindgen", "wasm-bindgen-futures"]

[dependencies]
parley.workspace = true
serde.workspace = true
m3-tokens     = { path = "../m3-tokens" }
mui-rs-renderer   = { path = "../mui-rs-renderer" }

wasm-bindgen         = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }

[dev-dependencies]
insta.workspace = true

# `parley` is used (text layout) but machete's heuristic misses it;
# `wasm-bindgen-futures` is wired via the `wasm` feature.
[package.metadata.cargo-machete]
ignored = ["parley", "wasm-bindgen-futures"]
