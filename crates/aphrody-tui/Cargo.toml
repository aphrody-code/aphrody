# SPDX-License-Identifier: Apache-2.0
[package]
name                   = "aphrody-tui"
publish                = false
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
homepage.workspace     = true
repository.workspace   = true
license.workspace      = true
description            = "Pure-Rust ratatui-style DSL — canonical long-term TUI surface for the aphrody LLM-first terminal (60fps target, zero JS)."

[lib]
crate-type = ["rlib"]

[lints]
workspace = true

# ---------------------------------------------------------------------------
# Dependencies (workspace pins — see root Cargo.toml).
# ---------------------------------------------------------------------------
[dependencies]
ratatui                   = { workspace = true }
crossterm                 = { workspace = true }
tokio                     = { workspace = true, features = ["rt", "macros", "time", "sync"] }
thiserror                 = { workspace = true }
# CommonMark -> ANSI rendering for `widgets::MarkdownView`. We re-parse the
# ANSI SGR output via the in-crate `ansi` module so colours/bold/italic/etc.
# survive the trip into ratatui's Buffer.
aphrody-terminal-markdown = { path = "../aphrody-terminal-markdown" }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "time", "sync", "test-util"] }
