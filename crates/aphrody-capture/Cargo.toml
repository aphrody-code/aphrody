# SPDX-License-Identifier: Apache-2.0
[package]
name                   = "aphrody-capture"
publish                = false
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
homepage.workspace     = true
repository.workspace   = true
license.workspace      = true
description            = "Native Windows screen and window capture to PNG. GDI-based, zero unsafe outside FFI wrappers, RAII GDI handle guards."

[lib]
crate-type = ["rlib"]

[lints]
workspace = true

[dependencies]
# Structured error type.
thiserror  = { workspace = true }
# PNG encoding: RgbaImage -> Vec<u8>. Only the `png` codec is required;
# default-features = false avoids pulling every format decoder.
image      = { workspace = true, features = ["png"] }

# Win32 GDI + WindowsAndMessaging — Windows-only. On non-Windows the lib
# compiles to stubs that return CaptureError::Unsupported.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Storage_Xps",
] }

[dev-dependencies]
# No extra dev deps: unit tests are pure Rust (bgra_to_rgba + error variants).
