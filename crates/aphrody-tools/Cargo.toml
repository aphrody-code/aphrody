# SPDX-License-Identifier: Apache-2.0
[package]
name                   = "aphrody-tools"
publish                = false
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
homepage.workspace     = true
repository.workspace   = true
license.workspace      = true
description            = "Tool descriptor registry (JSON Schema input/output) with cross-vendor exporters/importers for Anthropic tool-use, Gemini function declarations and MCP `tools/list` shapes."

[lints]
workspace = true

[dependencies]
serde      = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror  = { workspace = true }
tracing    = { workspace = true }
schemars   = { workspace = true }
regex      = { workspace = true }
async-trait = { workspace = true }
sha2       = { workspace = true }
similar    = { workspace = true }

# --- Builtin tools deps (skip on wasm32) ----------------------------------
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio    = { workspace = true, features = ["fs", "io-util", "rt", "macros", "sync", "time", "net"] }
globset  = { workspace = true }
ignore   = { workspace = true }
walkdir  = { workspace = true }
reqwest  = { workspace = true }
base64   = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio    = { workspace = true, features = ["full"] }
tempfile = { workspace = true }
# rustls is needed at runtime (not just transitively): the workspace pin uses
# `rustls-no-provider`, so tests that exercise `web_fetch` must install the
# ring provider themselves before constructing a `reqwest::Client`. In
# production the same install happens in `crates/cli/src/main.rs`.
rustls   = { workspace = true }

[package.metadata.cargo-machete]
# `schemars` ships derive macros used by JSON Schema generators; ignored to
# survive false-positives when no `#[derive(JsonSchema)]` lives in this crate.
# `tracing` is consumed via `tracing::debug!` and may be inlined out under
# release builds, leading machete to flag it.
ignored = ["schemars", "tracing"]
