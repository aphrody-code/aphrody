# SPDX-License-Identifier: Apache-2.0
[package]
name                   = "aphrody-tools"
publish                = false
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
homepage.workspace     = true
repository.workspace   = true
license.workspace      = true
description            = "Tool descriptor registry (JSON Schema input/output) with cross-vendor exporters/importers for Anthropic tool-use, Gemini function declarations and MCP `tools/list` shapes."

[lints]
workspace = true

[dependencies]
serde      = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror  = { workspace = true }
tracing    = { workspace = true }
schemars   = { workspace = true }
regex      = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[package.metadata.cargo-machete]
# `schemars` ships derive macros used by JSON Schema generators; ignored to
# survive false-positives when no `#[derive(JsonSchema)]` lives in this crate.
# `tracing` is consumed via `tracing::debug!` and may be inlined out under
# release builds, leading machete to flag it.
ignored = ["schemars", "tracing"]
