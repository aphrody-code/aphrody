# SPDX-License-Identifier: Apache-2.0
[package]
name                   = "aphrody-voice"
publish                = false
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
homepage.workspace     = true
repository.workspace   = true
license.workspace      = true
description            = "Voice I/O (TTS + STT) provider traits + ElevenLabs/Whisper adapters + Discord shim."

[features]
# Enable the local offline Whisper backend (requires C++ toolchain + libwhisper.cpp model weights).
local-whisper = ["dep:whisper-rs"]

[lints]
workspace = true

# Dependencies available on all targets (wasm-compatible).
[dependencies]
async-trait = { workspace = true }
futures     = { workspace = true }
serde       = { workspace = true, features = ["derive"] }
serde_json  = { workspace = true }
bytes       = { workspace = true }
thiserror   = { workspace = true }

# Native-only deps: tokio + reqwest pull mio which does not compile for wasm32.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio  = { workspace = true, features = ["rt", "macros", "io-util", "fs"] }
reqwest = { workspace = true, features = ["json", "stream", "multipart", "rustls-no-provider"] }
whisper-rs = { version = "0.13", optional = true }

# Browser-native deps: only compiled when targeting wasm32.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
js-sys       = { workspace = true }
web-sys      = { workspace = true, features = [
    "Window",
    "SpeechSynthesis",
    "SpeechSynthesisUtterance",
    "SpeechSynthesisVoice",
] }

[package.metadata.cargo-machete]
ignored = ["wasm-bindgen", "js-sys", "web-sys"]

[dev-dependencies]
tokio       = { workspace = true, features = ["rt", "macros"] }
serde_json  = { workspace = true }
