[package]
name                  = "google_mcp"
publish               = false
version.workspace     = true
edition.workspace     = true
rust-version.workspace = true
authors.workspace     = true
license.workspace     = true
homepage.workspace    = true
repository.workspace  = true
description           = "Aphrody MCP (Model Context Protocol) server bridge."

[lints]
workspace = true

[dependencies]
rmcp               = { workspace = true }
anyhow             = { workspace = true }
tokio              = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest            = { workspace = true }
# Direct `rustls` dep enables `ring::default_provider()` in main() to satisfy
# the `rustls-no-provider` contract on reqwest. `ring` requires a C compiler;
# cross-compiling Windows→Linux requires `cargo zigbuild` (Zig as cc).
rustls             = { workspace = true }
schemars           = { workspace = true }
axum               = { workspace = true }
sysinfo            = { workspace = true }
backend            = { path = "../backend" }

[target.'cfg(target_os = "windows")'.dependencies]
windows            = { workspace = true }
