[package]
name                  = "google_mcp"
publish               = false
version.workspace     = true
edition.workspace     = true
rust-version.workspace = true
authors.workspace     = true
license.workspace     = true
homepage.workspace    = true
repository.workspace  = true
description           = "aphrody-mcp — unified Rust MCP stdio server fusing google_mcp (8 OS/forensic/recon tools) with bxc-engine (7 scraping tools). 15 tools, pure Rust, ~6.5 MB binary, sub-millisecond cold-start."

# The crate stays named `google_mcp` (historical), but ships a single
# binary named `aphrody-mcp` consumed by the Claude Code plugin.
[[bin]]
name = "aphrody-mcp"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
rmcp               = { workspace = true }
anyhow             = { workspace = true }
clap               = { workspace = true }
tokio              = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest            = { workspace = true }
# Direct `rustls` dep enables `ring::default_provider()` in main() to satisfy
# the `rustls-no-provider` contract on reqwest. `ring` requires a C compiler;
# cross-compiling Windows→Linux requires `cargo zigbuild` (Zig as cc).
rustls             = { workspace = true }
schemars           = { workspace = true }
axum               = { workspace = true }
sysinfo            = { workspace = true }
backend            = { path = "../backend" }
# MCP client surface: reuse the production-tested implementation from
# gemini-runtime (stdio + HTTP transports, Claude Desktop compatible config
# loader). This is the same crate the gemini CLI runtime drives at runtime,
# 59/59 unit tests green at the time of integration.
gemini-runtime     = { path = "../gemini-runtime" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Voice MCP tool wiring (voice_synthesize + voice_transcribe). The voice_tools
# module is `#[cfg(not(target_arch = "wasm32"))]`-gated so the deps follow the
# same cfg. Both crates live in the workspace; here we re-export the path deps.
aphrody-voice      = { workspace = true }
# base64 STANDARD encoding for audio payload framing in voice_tools.
base64             = { workspace = true }
# Reverse engineering triage (re_triage MCP tool). Pure Rust, no GPL.
aphrody-re         = { path = "../aphrody-re" }

[target.'cfg(target_os = "windows")'.dependencies]
windows            = { workspace = true }

[dev-dependencies]
tempfile           = { workspace = true }
# `initialize_handshake` bench — measures `aphrody-mcp` stdio handshake
# p50/p95 (PLAN R-A R1.5). Same convention as `crates/cli/benches/cold_start.rs`.
criterion          = { workspace = true }

# --- MCP handshake benchmarks (native targets only) ------------------------
# The bench harness spawns the freshly-built `aphrody-mcp` binary, so it
# cannot run on wasm32 (no Command::output) and is gated implicitly via the
# `gemini_runtime::McpClient::from_stdio` cfg in upstream. `harness = false`
# disables libtest so criterion can install its own main() — same convention
# as `crates/cli/benches/cold_start.rs`.
[[bench]]
name    = "initialize_handshake"
harness = false
