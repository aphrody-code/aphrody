# SPDX-License-Identifier: Apache-2.0
[package]
name                   = "aphrody-channels"
publish                = false
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
homepage.workspace     = true
repository.workspace   = true
license.workspace      = true
description            = "Unified messaging-channel trait + Slack / Telegram / Matrix adapters."

[lints]
workspace = true

[dependencies]
# Async runtime — rt-multi-thread + macros + io (used by inbox stream tasks).
tokio        = { workspace = true, features = ["rt-multi-thread", "macros", "io-util"] }
# HTTP client — json + stream + multipart; TLS provider resolved globally by
# the CLI binary at startup.  `multipart` is not in the workspace default
# feature set, so we declare it explicitly here.
reqwest      = { workspace = true, features = ["multipart"] }
# Serialization — trait + derive macros.
serde        = { workspace = true, features = ["derive"] }
serde_json   = { workspace = true }
# Async trait support (`async fn` in traits, stable-friendly shim).
async-trait  = { workspace = true }
# `async_stream::try_stream!` for `stream_inbox()` impls.
async-stream = { workspace = true }
# Ergonomic error types.
thiserror    = { workspace = true }
# URL parsing / building.
url          = { workspace = true }
# Zero-copy byte buffers (file upload bodies).
bytes        = { workspace = true }
# Stream combinator utilities (StreamExt, TryStreamExt).
futures      = { workspace = true }
# ReceiverStream wrapper for mpsc channels.
tokio-stream = { workspace = true }
# Structured logging.
tracing      = { workspace = true }
# Timestamp arithmetic.
chrono       = { workspace = true }

[dev-dependencies]
tokio      = { workspace = true, features = ["rt-multi-thread", "macros"] }
serde_json = { workspace = true }
reqwest    = { workspace = true }

[package.metadata.cargo-machete]
# reqwest features are cfg-gated across workspace; listed to suppress machete.
ignored = []
