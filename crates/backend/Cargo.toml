[package]
name                  = "backend"
publish               = false
version.workspace     = true
edition.workspace     = true
rust-version.workspace = true
authors.workspace     = true
license.workspace     = true
homepage.workspace    = true
repository.workspace  = true
keywords.workspace    = true
categories.workspace  = true
description           = "Aphrody forensics and backend logic (Rust)."

[lints]
workspace = true

[dependencies]
tokio              = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
anyhow             = { workspace = true }
reqwest            = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
base64             = { workspace = true }
base               = { path = "../base", version = "1.0.0-canary" }

# rusqlite is only required by chromium.rs (Windows DPAPI credential extraction).
# On Linux/WASM it must not be compiled because libsqlite3-sys requires a C
# cross-compiler (x86_64-linux-gnu-gcc) which is not available in those CI
# environments, and Chromium credential extraction is Windows-only by nature.
[target.'cfg(target_os = "windows")'.dependencies]
rusqlite           = { workspace = true }
