[package]
name                  = "aphrody-wasm"
publish               = false
version.workspace     = true
edition.workspace     = true
rust-version.workspace = true
authors.workspace     = true
license.workspace     = true
homepage.workspace    = true
repository.workspace  = true
description           = "Browser-facing WASM wrapper: exposes base primitives via wasm-bindgen."

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

# ---------------------------------------------------------------------------
# wasm-pack metadata
# ---------------------------------------------------------------------------
# `npm-name` sets the npm package name in the generated package.json.
# `wasm-opt` passes extra flags to wasm-opt so SIMD128 code (emitted by the
# `aes` / `aes-gcm` crates via LLVM auto-vectorisation) is accepted by
# Binaryen's validator.  Without `--enable-simd`, wasm-opt aborts on valid
# SIMD128 instructions produced by the AES-NI backend.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-simd", "--enable-bulk-memory"]

# Cross-platform dep: base primitives are available on all targets.
[dependencies]
base    = { path = "../base" }
aes-gcm = { workspace = true }

# WASM-only deps: gated so native + Linux builds remain clean.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen          = { workspace = true }
wasm-bindgen-futures  = { workspace = true }
js-sys                = { workspace = true }
web-sys               = { workspace = true, features = [
    "Window",
    "Performance",
    "console",
    # Required by gradient_hero: DOM canvas element acquisition.
    "Document",
    "Element",
    "HtmlCanvasElement",
] }
console_error_panic_hook = { workspace = true }
console_log           = { workspace = true }
log                   = { workspace = true }
# WebGPU pipeline — browser backend only.
# The `webgpu` feature enables wgpu's navigator.gpu path (no wgpu-hal, no wgpu-core).
wgpu                  = { workspace = true, features = ["webgpu"] }
# bytemuck: safe cast of &[f32] → &[u8] for queue.write_buffer.
bytemuck              = { workspace = true }

# All deps in this crate are wasm32-gated; machete cannot introspect cfg-conditional
# dep sections and will incorrectly report them as unused on a native host scan.
[package.metadata.cargo-machete]
ignored = ["wasm-bindgen", "wasm-bindgen-futures", "js-sys", "web-sys", "console_error_panic_hook", "console_log", "log", "aes-gcm", "wgpu", "bytemuck"]

# wasm-bindgen-test must be pinned EXACT to the same version as wasm-bindgen
# (they are sub-crates of the same release and must match byte-for-byte).
[dev-dependencies]
wasm-bindgen-test = "=0.3.71"
m3-tokens         = { path = "../m3-tokens" }

# Native-only example: tiny `std::net` HTTP server serving the demo HTML on
# 127.0.0.1:18800. Built only when targeting non-wasm hosts so wasm-pack
# does not try to compile a `TcpListener`-based binary into wasm32.
[[example]]
name              = "serve"
path              = "examples/serve.rs"
required-features = []
