# SPDX-License-Identifier: Apache-2.0
[package]
name                   = "aphrody-infer"
publish                = false
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
homepage.workspace     = true
repository.workspace   = true
license.workspace      = true
description            = "Local ONNX inference backend for aphrody: runtime discovery, execution-provider selection with CUDA/DirectML/CPU fallback, and session loading driven by the aphrody-models catalog."

[lib]
crate-type = ["rlib"]

[lints]
workspace = true

[features]
default = []
onnx = ["dep:ort"]

[dependencies]
aphrody-models = { workspace = true }
thiserror      = { workspace = true }
tracing        = { workspace = true }
serde          = { workspace = true }
dirs           = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ort = { workspace = true, optional = true, features = ["load-dynamic", "cuda", "directml"] }

[dev-dependencies]
tempfile = { workspace = true }
