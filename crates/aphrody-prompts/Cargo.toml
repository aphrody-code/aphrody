# SPDX-License-Identifier: Apache-2.0
[package]
name                   = "aphrody-prompts"
publish                = false
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
homepage.workspace     = true
repository.workspace   = true
license.workspace      = true
description            = "Prompt template engine: minijinja-backed registry, typed variable validation, reusable partials, and PII-scrubbing pipeline."

[lints]
workspace = true

[dependencies]
serde      = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror  = { workspace = true }
tracing    = { workspace = true }
minijinja  = { workspace = true }
regex      = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[package.metadata.cargo-machete]
# `tracing` is consumed only through debug! / warn! macros.
ignored = ["tracing"]
