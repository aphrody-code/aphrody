# SPDX-License-Identifier: Apache-2.0
[package]
name                   = "aphrody-rateguard"
publish                = false
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
homepage.workspace     = true
repository.workspace   = true
license.workspace      = true
description            = "Per-provider token-bucket rate limiter for aphrody (Anthropic + Gemini + Antigravity only) — RPM + TPM quotas, per-model overrides, async acquire."

[lints]
workspace = true

[dependencies]
aphrody-providers = { workspace = true }
serde       = { workspace = true, features = ["derive"] }
serde_json  = { workspace = true }
thiserror   = { workspace = true }
tracing     = { workspace = true }
tokio       = { workspace = true, features = ["time", "sync", "macros", "rt"] }
parking_lot = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "time", "macros", "rt", "rt-multi-thread", "sync"] }

[package.metadata.cargo-machete]
# `tracing` macros (debug!/warn!) fire when buckets are starved / throttling
# decisions surface; keep it pinned even if a strict reader thinks it's unused.
# `serde_json` is exercised by the default-quotas JSON snapshot round-trip.
ignored = ["tracing", "serde_json"]
