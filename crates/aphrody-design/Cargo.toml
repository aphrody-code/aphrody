# SPDX-License-Identifier: Apache-2.0
[package]
name                   = "aphrody-design"
publish                = false
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
homepage.workspace     = true
repository.workspace   = true
license.workspace      = true
description            = "Unified design infrastructure: streaming artifact pipeline (sidecar) + SQLite project store & design-systems registry (daemon)."

[lints]
workspace = true

[lib]
name = "aphrody_design"
path = "src/lib.rs"

[[bin]]
name = "aphrody-design-sidecar"
path = "src/bin/sidecar.rs"

[[bin]]
name = "aphrody-design-daemon"
path = "src/bin/daemon.rs"

[dependencies]
# --- sidecar deps ---
anyhow     = { workspace = true }
clap       = { workspace = true }
quick-xml  = { workspace = true }
regex      = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
sha2       = { workspace = true }
thiserror  = { workspace = true }
tokio      = { workspace = true, features = ["rt-multi-thread", "io-std", "io-util", "macros", "sync", "signal", "time"] }
tracing    = { workspace = true }

# --- daemon deps ---
rusqlite           = { workspace = true }
tracing-subscriber = { workspace = true }
ulid               = { workspace = true }
time               = { workspace = true }
dirs               = { workspace = true }
aphrody-icons      = { path = "../aphrody-icons" }
m3-tokens          = { path = "../m3-tokens" }

[dev-dependencies]
tokio    = { workspace = true, features = ["rt-multi-thread", "macros", "io-util"] }
tempfile = { workspace = true }
