[package]
name                   = "aphrody-agent-runtime"
publish                = false
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
homepage.workspace     = true
repository.workspace   = true
license.workspace      = true
description            = "Wiring/factory layer that assembles a ready-to-run aphrody agent: builds a ModelClient (Gemini or stub), a ToolRegistry preloaded with the shell-exec + apply-patch tools, an optional rollout recorder, and spawns an aphrody-engine session. The ergonomic entry point every surface (CLI / TUI / desktop) uses to start an autonomous agent."

[lints]
workspace = true

[dependencies]
aphrody-engine       = { path = "../aphrody-engine" }
aphrody-agent-proto  = { path = "../aphrody-agent-proto" }
aphrody-agent-tools  = { path = "../aphrody-agent-tools" }
aphrody-model-client = { path = "../aphrody-model-client" }
aphrody-toolcall     = { path = "../aphrody-toolcall" }
aphrody-rollout      = { path = "../aphrody-rollout" }
serde               = { workspace = true }
serde_json          = { workspace = true }
thiserror           = { workspace = true }
tokio               = { workspace = true }
tokio-stream        = { workspace = true }
futures             = { workspace = true }
async-trait         = { workspace = true }
tracing             = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile          = { workspace = true }
tokio             = { workspace = true }
