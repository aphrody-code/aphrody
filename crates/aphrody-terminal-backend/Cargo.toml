[package]
name                   = "aphrody-terminal-backend"
publish                = false
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
homepage.workspace     = true
repository.workspace   = true
license.workspace      = true
description            = "Native pty driver and WebSocket server for aphrody-terminal (cross-platform via portable-pty)."

[lints]
workspace = true

[dependencies]
portable-pty        = { workspace = true }
tokio               = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "sync", "net"] }
tokio-tungstenite   = { workspace = true }
futures-util        = { workspace = true }
anyhow              = { workspace = true }
tracing             = { workspace = true }
serde               = { workspace = true }
serde_json          = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "io-util", "sync", "net", "process"] }
