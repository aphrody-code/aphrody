[package]
name = "mui-rs-renderer"
description = "M3 GPU renderer — vello 2D + wgpu backend + elevation shadows"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
default = ["desktop"]
desktop = ["wgpu/vulkan-portability", "wgpu/metal", "wgpu/dx12"]
web     = ["wgpu/webgl", "wasm-bindgen", "web-sys", "js-sys", "console_error_panic_hook", "tracing-wasm"]
android = ["android-activity"]

[dependencies]
thiserror.workspace = true
anyhow.workspace = true
wgpu = "28"
vello.workspace = true
peniko.workspace = true
kurbo.workspace = true
tiny-skia.workspace = true
bytemuck.workspace = true
half.workspace = true
tracing.workspace = true
taffy.workspace = true
m3-tokens = { path = "../m3-tokens" }

# web
wasm-bindgen         = { workspace = true, optional = true }
web-sys              = { workspace = true, optional = true }
js-sys               = { workspace = true, optional = true }
console_error_panic_hook = { workspace = true, optional = true }
tracing-wasm         = { workspace = true, optional = true }

# android
android-activity = { workspace = true, optional = true }

[dev-dependencies]
pollster.workspace = true
insta.workspace = true
