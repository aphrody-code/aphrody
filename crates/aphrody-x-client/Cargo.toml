# Self-rooted workspace pour éviter toute collision avec les agents bg
# qui éditent simultanément le root Cargo.toml. À folder dans le root
# workspace.members plus tard, une fois tous les ports stabilisés.
[workspace]

[package]
name        = "aphrody-x-client"
version     = "0.1.0"
edition     = "2024"
license     = "Apache-2.0"
description = "aphrody — X / Twitter client (cookie-based auth, no API key required, agent-twitter-client wrapper)"
repository  = "https://github.com/aphrody-code/aphrody"

[[bin]]
name = "aphrody-x"
path = "src/main.rs"

[dependencies]
# distrihub fork (Nov 2025) — patché .domain("x.com") sur les 4 sites de
# cookie injection, contre le cornip/agent-twitter-client 0.1.2 upstream
# (Dec 2024, repo supprimé) qui hard-codait twitter.com pre-rebrand →
# 401 Unauthorized sur les cookies modernes .x.com.
agent-twitter-client = { git = "https://github.com/distrihub/agent-twitter-client.git" }
tokio                = { version = "1.52", features = ["full"] }
clap                 = { version = "4", features = ["derive", "env"] }
anyhow               = "1"
dotenvy              = "0.15"
serde_json           = "1"
