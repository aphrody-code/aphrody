[package]
name = "a2a-pb"
version = "0.1.8"
description = "A2A v1 protobuf-generated types and conversion layer"
readme = "README.md"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace  = true
authors.workspace       = true
homepage.workspace      = true
keywords.workspace      = true
categories.workspace    = true

[lib]
name = "a2a_pb"

[lints]
workspace = true

[dependencies]
a2a = { workspace = true }
serde = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
pbjson = { workspace = true }
pbjson-types = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }

# tonic pulls tokio::net / mio which do not compile on wasm32.
# Gate to native targets only; wasm consumers use `protojson_conv` instead.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
tonic = { workspace = true }
tonic-prost = { workspace = true }

[build-dependencies]
pbjson-build = { workspace = true }
protoc-bin-vendored = { workspace = true }
tonic-prost-build = { workspace = true }
