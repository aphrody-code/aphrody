# SPDX-License-Identifier: Apache-2.0
[package]
name                   = "aphrody-design-agents"
publish                = false
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
homepage.workspace     = true
repository.workspace   = true
license.workspace      = true
description            = "PATH detector + spawner for 3 coding-agent CLIs (Claude Code, Gemini CLI, Antigravity CLI) with ACP/Stdio dispatch and SSE normalization."

[lints]
workspace = true

[lib]
name = "aphrody_design_agents"
path = "src/lib.rs"

[[bin]]
name = "aphrody-design-agents"
path = "src/bin/main.rs"

[dependencies]
anyhow       = { workspace = true }
clap         = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
thiserror    = { workspace = true }
tempfile     = { workspace = true }
tokio        = { workspace = true, features = ["rt-multi-thread", "io-std", "io-util", "macros", "process", "fs", "sync", "time"] }
tokio-stream = { workspace = true, features = ["io-util"] }
which        = { workspace = true }
futures-core = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio    = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "process", "fs", "time"] }

[package.metadata.cargo-machete]
ignored = []
