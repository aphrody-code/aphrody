<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A2A Channel Viewer</title>
  <link rel="icon" type="image/webp" href="aphrody.webp">
  <link rel="apple-touch-icon" href="aphrody.webp">
  <style>
    /* -----------------------------------------------------------------------
       Minimal stylesheet for the A2A channel viewer.
       No external fonts or CDN dependencies — works fully offline.
    ----------------------------------------------------------------------- */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: ui-monospace, "Cascadia Code", "Fira Code", monospace;
      font-size: 14px;
      background: #0d1117;
      color: #e6edf3;
      padding: 24px;
      line-height: 1.6;
    }

    h1 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 20px;
      color: #58a6ff;
      letter-spacing: 0.02em;
    }

    #channel-view {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 900px;
    }

    .a2a-envelope {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .a2a-envelope[data-kind="fact"]  { border-left: 3px solid #3fb950; }
    .a2a-envelope[data-kind="ask"]   { border-left: 3px solid #d29922; }
    .a2a-envelope[data-kind="ack"]   { border-left: 3px solid #58a6ff; }
    .a2a-envelope[data-kind="ping"]  { border-left: 3px solid #a371f7; }
    .a2a-envelope[data-kind="error"] { border-left: 3px solid #f85149; }

    .a2a-header {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .a2a-from  { color: #79c0ff; font-weight: 600; }
    .a2a-arrow { color: #6e7681; }
    .a2a-to    { color: #79c0ff; opacity: 0.75; }

    .a2a-kind {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 2px 7px;
      border-radius: 12px;
      background: #21262d;
      color: #8b949e;
    }

    .a2a-envelope[data-kind="fact"]  .a2a-kind { color: #3fb950; background: #0d2418; }
    .a2a-envelope[data-kind="ask"]   .a2a-kind { color: #d29922; background: #2d2000; }
    .a2a-envelope[data-kind="ack"]   .a2a-kind { color: #58a6ff; background: #0d1a2e; }
    .a2a-envelope[data-kind="ping"]  .a2a-kind { color: #a371f7; background: #1e1030; }
    .a2a-envelope[data-kind="error"] .a2a-kind { color: #f85149; background: #2d1118; }

    .a2a-ts {
      margin-left: auto;
      font-size: 12px;
      color: #6e7681;
    }

    .a2a-topic {
      font-weight: 600;
      color: #e6edf3;
    }

    .a2a-body {
      font-size: 13px;
      color: #8b949e;
      white-space: pre-wrap;
      word-break: break-word;
      background: #0d1117;
      border-radius: 4px;
      padding: 10px 12px;
      border: 1px solid #21262d;
      max-height: 200px;
      overflow-y: auto;
    }

    #status {
      margin-bottom: 16px;
      font-size: 13px;
      color: #6e7681;
    }

    #status.error { color: #f85149; }
    #status.ok    { color: #3fb950; }
  </style>
</head>
<body>
  <h1>A2A Channel Viewer</h1>
  <p id="status">Loading WASM module…</p>
  <div id="channel-view"></div>

  <script type="module">
    // -----------------------------------------------------------------------
    // Load the wasm-pack output.  Run `wasm-pack build --target web` from
    // crates/a2a-ui/ first; this script expects the generated files at
    // pkg/a2a_ui.js and pkg/a2a_ui_bg.wasm relative to this HTML file.
    //
    // For local development, serve this directory with any static file server:
    //   bun --bun serve .          (from the examples/ directory)
    //   python3 -m http.server 8080
    // -----------------------------------------------------------------------
    import init, { init_panic_hook, render_envelope_list } from "../pkg/a2a_ui.js";

    const statusEl = document.getElementById("status");

    async function main() {
      try {
        // 1. Initialise the WASM module (fetches + compiles the .wasm binary).
        await init();

        // 2. Install the panic hook so Rust panics surface as readable errors
        //    in the browser DevTools console instead of a cryptic abort trap.
        init_panic_hook();

        statusEl.textContent = "WASM ready — fetching envelopes…";
        statusEl.className = "";

        // 3. Fetch the sample envelope payload bundled alongside this page.
        const resp = await fetch("./envelopes.json");
        if (!resp.ok) {
          throw new Error(`Failed to fetch envelopes.json: HTTP ${resp.status}`);
        }
        const json = await resp.text();

        // 4. Hand the raw JSON string to the Rust render function.
        //    The WASM function parses, validates, and builds DOM nodes directly.
        render_envelope_list("channel-view", json);

        statusEl.textContent = "Channel view rendered.";
        statusEl.className = "ok";
      } catch (err) {
        statusEl.textContent = `Error: ${err.message ?? err}`;
        statusEl.className = "error";
        console.error("[a2a-ui]", err);
      }
    }

    main();
  </script>
</body>
</html>
