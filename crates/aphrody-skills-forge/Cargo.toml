# SPDX-License-Identifier: Apache-2.0
[package]
name                   = "aphrody-skills-forge"
publish                = false
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
homepage.workspace     = true
repository.workspace   = true
license.workspace      = true
description            = "Programmatic SKILL.md scaffolding + registry loader + lint engine for the aphrody skill catalog."

[lints]
workspace = true

[dependencies]
serde       = { workspace = true }
serde_json  = { workspace = true }
serde_yaml  = { workspace = true }
schemars    = { workspace = true }
thiserror   = { workspace = true }
walkdir     = { workspace = true }
regex       = { workspace = true }
comrak      = { workspace = true }
once_cell   = { workspace = true }
tokio       = { workspace = true, features = ["fs", "rt", "macros"] }

[dev-dependencies]
tempfile = { workspace = true }

[package.metadata.cargo-machete]
# tokio is exposed by `async_load_registry` (cfg-gated public surface), schemars
# is used through derive macros only — both are reported as unused otherwise.
ignored = ["tokio", "schemars"]
