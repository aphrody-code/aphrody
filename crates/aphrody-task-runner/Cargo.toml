# SPDX-License-Identifier: Apache-2.0
[package]
name                   = "aphrody-task-runner"
publish                = false
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
homepage.workspace     = true
repository.workspace   = true
license.workspace      = true
description            = "Parallel DAG task executor with dependency ordering, retries, timeouts, concurrency caps and NDJSON-friendly event stream for aphrody background pipelines."

[lints]
workspace = true

[dependencies]
serde        = { workspace = true, features = ["derive"] }
serde_json   = { workspace = true }
thiserror    = { workspace = true }
tracing      = { workspace = true }
async-trait  = { workspace = true }
tokio        = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
chrono       = { workspace = true }
futures-util = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "time", "macros", "rt", "rt-multi-thread"] }

[package.metadata.cargo-machete]
# `tracing` is used through macros only; `async-trait` surfaces on the
# `TaskAction` trait; `futures-util` only via the `StreamExt` adapter in
# the report renderer. Keep all three explicit so machete doesn't misfire.
ignored = ["tracing", "async-trait", "futures-util"]
