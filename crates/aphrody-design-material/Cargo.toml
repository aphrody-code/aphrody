# SPDX-License-Identifier: Apache-2.0
[package]
name                   = "aphrody-design-material"
publish                = false
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
homepage.workspace     = true
repository.workspace   = true
license.workspace      = true
description            = "Material Design 3 (M3) skin of open-design: HCT-approx tonal palettes, 4 schemes (light/dark/HC light/HC dark), state layers, shape, elevation, motion, typography, 6 visual directions including Material Expressive."

[lints]
workspace = true

[lib]
name = "aphrody_design_material"
path = "src/lib.rs"

[[bin]]
name = "aphrody-design-material"
path = "src/bin/main.rs"

[dependencies]
serde      = { workspace = true }
serde_json = { workspace = true }
anyhow     = { workspace = true }
thiserror  = { workspace = true }
clap       = { workspace = true }
tokio      = { workspace = true, features = ["rt-multi-thread", "macros", "fs", "io-util"] }
tracing    = { workspace = true }
walkdir    = { workspace = true }
comrak     = { workspace = true }
