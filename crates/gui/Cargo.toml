[package]
name                  = "gui"
publish               = false
version.workspace     = true
edition.workspace     = true
rust-version.workspace = true
authors.workspace     = true
license.workspace     = true
homepage.workspace    = true
repository.workspace  = true
description           = "Aphrody — UI surface (Rust Native)."

[lints]
workspace = true

# Explicit lib + bin entries so we can hide the binary on wasm32 (the
# binary needs a real `fn main`, which would require pulling
# wry/tao/mimalloc back in — not what we want for the lib-only browser
# path).
[lib]
path = "src/lib.rs"

[[bin]]
name             = "gui"
path             = "src/main.rs"
required-features = []

[dependencies]
# Cross-target deps (compile everywhere — pure Rust).
serde      = { workspace = true }
serde_json = { workspace = true }
tracing    = { workspace = true }
# Material Design 3 tokens — feeds the runtime-injected CSS in index.html
# AND the JSON returned by the `cmd: "tokens"` IPC handler, so the desktop
# surface and the TUI surface share one palette source.
m3-tokens  = { path = "../m3-tokens" }
aphrody-icons = { path = "../aphrody-icons" }
base64.workspace = true

# Native-only deps. Gated off wasm32 — winit/wgpu/mimalloc pull native
# window handles / C source incompatible with `wasm32-unknown-unknown`,
# so the lib carries a `#![cfg(not(target_arch = "wasm32"))]` gate AND
# the dep graph is kept clean here so a stray `cargo check -p gui
# --target wasm32-unknown-unknown` doesn't drag mimalloc.h into wasm-ld.
# (Desktop window = winit + wgpu/vello; no wry/tao webview — best-stack-2026:
# tao/wry pull GTK3 CVEs on Linux.)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
winit              = { workspace = true }
pollster           = { workspace = true }
mui-rs-renderer    = { path = "../mui-rs-renderer" }
mui-rs-components  = { path = "../mui-rs-components" }
tokio              = { workspace = true }
anyhow             = { workspace = true }
tracing-subscriber = { workspace = true }
mimalloc           = { workspace = true }
backend            = { path = "../backend" }
taffy              = { workspace = true }
tuono_lib          = { path = "../tuono_lib" }
tuono_internal     = { path = "../tuono_internal" }
tuono              = { path = "../tuono" }
tuono_lib_macros   = { path = "../tuono_lib_macros" }

aphrody-chat       = { path = "../aphrody-chat" }
aphrody-sdk         = { path = "../aphrody-sdk" }
aphrody-events      = { path = "../aphrody-events" }
aphrody-context     = { path = "../aphrody-context" }
aphrody-session     = { path = "../aphrody-session" }
aphrody-tools       = { path = "../aphrody-tools" }
aphrody-memory      = { path = "../aphrody-memory" }
aphrody-secrets     = { path = "../aphrody-secrets" }
aphrody-llm-infra   = { path = "../aphrody-llm-infra" }
aphrody-prompts     = { path = "../aphrody-prompts" }
aphrody-router      = { path = "../aphrody-router" }
aphrody-skills      = { path = "../aphrody-skills" }
gemini-runtime      = { path = "../gemini-runtime" }
aphrody-providers   = { workspace = true }
