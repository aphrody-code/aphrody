# SPDX-License-Identifier: Apache-2.0
# ============================================================================
#  agui-bridge — Rust bindings for the AG-UI (Agent UI) protocol.
#
#  Mapping table
#  -------------
#  <a-gui-button>    -> shadcn-bridge::button::create_button  (MWC3 md-*-button)
#  <a-gui-input>     -> bespoke <input> / <md-outlined-text-field>
#  <a-gui-container> -> <div class="agui-container">
#  <a-gui-tool-call> -> <div class="agui-tool-call"> with tool name + status
#  <a-gui-markdown>  -> <div class="agui-markdown"> (host styles)
#  <a-gui-image>     -> <img> with src + alt
#  <a-gui-code>      -> <pre><code> with optional lang class
# ============================================================================
[package]
name                   = "agui-bridge"
publish                = false
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
homepage.workspace     = true
repository.workspace   = true
license.workspace      = true
description            = "Rust bindings for the AG-UI (Agent UI) protocol: wire-format parser + wasm-bindgen DOM renderer."

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
serde         = { workspace = true, features = ["derive"] }
serde_json    = { workspace = true }
thiserror     = { workspace = true }
shadcn-bridge = { path = "../shadcn-bridge" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
js-sys       = { workspace = true }
web-sys      = { workspace = true, features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlImageElement",
    "HtmlPreElement",
    "Node",
    "console",
] }

[package.metadata.cargo-machete]
ignored = ["wasm-bindgen", "js-sys", "web-sys"]
