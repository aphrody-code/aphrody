[package]
name                   = "aphrody-agent-proto"
publish                = false
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
homepage.workspace     = true
repository.workspace   = true
license.workspace      = true
description            = "Agent submission/event protocol: the Submission{id,op} (client to agent) and Event{id,msg} (agent to client) queues, the Op and EventMsg enums, and a newline-delimited JSON (NDJSON) wire codec shared by every aphrody surface (CLI / TUI / desktop / MCP). Inspired by OpenAI Codex protocol (Apache-2.0)."

[lints]
workspace = true

[dependencies]
serde      = { workspace = true }
serde_json = { workspace = true }
thiserror  = { workspace = true }

# The workspace `uuid` is declared with the `v4` feature but no wasm randomness
# source (`js` / `rng-getrandom`), which makes the crate fail to compile on
# `wasm32-unknown-unknown`. This crate must stay wasm-pure, so `uuid` is only
# pulled on non-wasm targets; the wasm build synthesizes v4-shaped ids without
# it (see `gen_uuid_v4` in src/lib.rs).
[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
uuid = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
