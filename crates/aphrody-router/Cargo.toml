# SPDX-License-Identifier: Apache-2.0
[package]
name                   = "aphrody-router"
publish                = false
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
homepage.workspace     = true
repository.workspace   = true
license.workspace      = true
description            = "Provider-whitelisted LLM router (Anthropic + Gemini + Antigravity)."

[lints]
workspace = true

[dependencies]
aphrody-providers = { workspace = true }
serde         = { workspace = true, features = ["derive"] }
serde_json    = { workspace = true }
thiserror     = { workspace = true }
tracing       = { workspace = true }
async-trait   = { workspace = true }
tokio         = { workspace = true, features = ["macros", "rt"] }
reqwest       = { workspace = true }
futures-util  = { workspace = true }
bytes         = { workspace = true }

[dev-dependencies]
tokio         = { workspace = true, features = ["rt-multi-thread", "macros", "test-util", "io-util", "net", "time", "sync"] }
serde_json    = { workspace = true }
axum          = { workspace = true }
rustls        = { workspace = true, features = ["ring"] }

[package.metadata.cargo-machete]
ignored = ["bytes", "rustls"]
