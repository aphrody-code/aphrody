# SPDX-License-Identifier: Apache-2.0
[package]
name                   = "aphrody-fsindex"
publish                = false
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
homepage.workspace     = true
repository.workspace   = true
license.workspace      = true
description            = "Persistent local-filesystem search index (SQLite FTS5), mirroring the Google desktop app's local_files.db. Metadata-only, privacy-bounded."

[lints]
workspace = true

[dependencies]
serde      = { workspace = true, features = ["derive"] }
thiserror  = { workspace = true }
walkdir    = { workspace = true }
# Bundled libsqlite3 (FTS5 enabled) — shares the workspace-pinned rusqlite +
# single `links = "sqlite3"` with aphrody-memory / cli forensics.
rusqlite   = { workspace = true }

[dev-dependencies]
tempfile   = { workspace = true }

[package.metadata.cargo-machete]
ignored = []
