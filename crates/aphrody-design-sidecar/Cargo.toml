# SPDX-License-Identifier: Apache-2.0
[package]
name                   = "aphrody-design-sidecar"
publish                = false
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
authors.workspace      = true
homepage.workspace     = true
repository.workspace   = true
license.workspace      = true
description            = "Streaming <artifact> block parser + per-format normalizer + SHA-256 manifest digest + multi-chunk merge + schema validate pipeline."

[lints]
workspace = true

[lib]
name = "aphrody_design_sidecar"
path = "src/lib.rs"

[[bin]]
name = "aphrody-design-sidecar"
path = "src/bin/main.rs"

[dependencies]
anyhow     = { workspace = true }
clap       = { workspace = true }
quick-xml  = { workspace = true }
regex      = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
sha2       = { workspace = true }
thiserror  = { workspace = true }
tokio      = { workspace = true, features = ["rt-multi-thread", "io-std", "io-util", "macros"] }
tracing    = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util"] }
