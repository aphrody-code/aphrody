# Self-rooted workspace pour les crates n2b-* — ces working copies de
# l'upstream aphrody-code/n2b@aphrody sont exclues du root workspace
# `C:/src/aphrody` mais doivent pouvoir compiler localement pour permettre
# le développement avant push upstream. Les autres n2b-* utilisent
# `edition.workspace = true` etc, donc on définit ici la racine virtuelle
# qui les agrège tous.
[workspace]
members = [
    ".",
    "../n2b-ai",
    "../n2b-core",
    "../n2b-github",
    "../n2b-native",
    "../n2b-registry",
    "../n2b-report",
    "../n2b-rules",
    "../n2b-scanners",
    "../n2b-types",
    "../n2b-util",
]
resolver = "2"

[workspace.package]
edition      = "2024"
rust-version = "1.97"
license      = "Apache-2.0"
authors      = ["aphrody-code"]
homepage     = "https://github.com/aphrody-code/n2b"
repository   = "https://github.com/aphrody-code/n2b"

[workspace.dependencies]
# Shared crates used by ≥2 n2b-* sub-crates. Aligned with upstream
# aphrody-code/n2b@aphrody. Versions match the root aphrody Cargo.toml
# where possible to avoid duplicate compilations when both workspaces
# share a target/ via CARGO_TARGET_DIR.
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"
anyhow            = "1"
regex             = "1"
once_cell         = "1"
memchr            = "2"
toml              = "0.8"
crossbeam-channel = "0.5"

[package]
name = "n2b"
version = "0.6.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "n2b"
path = "src/main.rs"

[dependencies]
n2b-core = { path = "../n2b-core" }
clap = { version = "4", features = ["derive", "color"] }
colored = "2"
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
anyhow = { workspace = true }
regex = { workspace = true }
once_cell = { workspace = true }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
similar = "2"
ignore = "0.4"
globset = "0.4"
fastembed = { version = "5", optional = true }

[features]
default = []
# Active le crosslink ML dans `n2b analyze` (fastembed + AllMiniLML6V2).
ai = ["dep:fastembed"]

[dev-dependencies]
# assert_cmd : tests d'intégration CLI-as-API. Rejoue les invocations
# utilisées par rpb-dashboard (cf. tests/rpb-dashboard-baseline/INVOCATIONS.md).
assert_cmd = "2"
# jsonschema : valide la sortie JSON de n2b contre schema/v2.json.
# Garantit que l'implémentation n'émet jamais une forme non-conforme.
jsonschema = { version = "0.35", default-features = false }
predicates = "3"
