[package]
name = "bxc-engine"
version.workspace = true
edition.workspace = true

[lib]
name = "bxc_engine"
path = "src/lib.rs"

[[bin]]
name = "bxc-engine"
path = "src/main.rs"

[[bin]]
name = "obscura-worker"
path = "src/worker.rs"

[[bin]]
name = "bxc-mcp"
path = "src/bin/bxc_mcp.rs"

# bxc-engine-daemon — HTTP API binary serving `/api/recon`, `/api/detect`,
# `/api/scrape`, `/api/tokens`, `/healthz`. Consumed by
# `crates/cli/src/scrape.rs::ScrapeClient` (Bun parity, Rust impl).
[[bin]]
name = "bxc-engine-daemon"
path = "src/bin/bxc_daemon.rs"

[features]
default = []
stealth = ["obscura-browser/stealth", "obscura-net/stealth", "obscura-mcp/stealth"]

[dependencies]
obscura-browser = { workspace = true }
obscura-mcp = { workspace = true }
obscura-cdp = { workspace = true }
obscura-dom = { workspace = true }
obscura-net = { workspace = true }
obscura-js = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
url = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rustls = { workspace = true, features = ["ring"] }
reqwest = { workspace = true }

# --- New deps for lib (scraper / cdp / daemon) ----------------------------
axum = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
scraper = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }

[package.metadata.cargo-machete]
ignored = ["clap", "url", "obscura-browser", "obscura-mcp", "obscura-cdp", "obscura-dom", "obscura-net", "obscura-js", "tokio-tungstenite", "futures-util"]
