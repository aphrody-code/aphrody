# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aphrody"
version = "0.1.0"
description = "Keyless Python client/CLI for Google's AI Ultra stack (Gemini, Cloud Code, Vertex AI) — uses on-device OAuth credentials, never an API key."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "aphrody contributors" }]
keywords = ["gemini", "vertex-ai", "cloud-code", "antigravity", "oauth", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "httpx>=0.28",
    "fire>=0.7",
    "google-genai>=1.0",
    "google-auth>=2.30",
]

[project.optional-dependencies]
# Browser-cookie extraction is LGPL-3.0; kept as an isolated optional extra
# so the core package stays Apache-2.0-clean (dynamic import = separate work).
cookies = ["browser-cookie3>=0.20"]
# `aphrody voice`: local Whisper STT + Kokoro TTS + the Antigravity agent brain
# (google-antigravity[voice] pulls faster-whisper, kokoro-onnx, numpy,
# websockets). The agent's localharness binary itself ships with the
# Antigravity desktop app; aphrody points ANTIGRAVITY_HARNESS_PATH at it.
voice = ["google-antigravity[voice]"]
# `aphrody image optimize` + `image icon` + the batch optimiser: lossless PNG
# via the oxipng Rust core, and WebP/AVIF/ICO re-encoding via Pillow >= 12
# (native AVIF, multi-resolution .ico).
images = ["pyoxipng>=9.1", "Pillow>=12.0"]
# `aphrody image icon`: Material 3 icon tooling. resvg-py rasterises SVG with
# zero system deps (Rust wheel — no Cairo); scour minifies SVG (pure Python,
# svgo is Node and banned); pyconify fetches Material Symbols by name from the
# Iconify API (no giant clone needed). Pillow writes multi-size Windows .ico.
icons = ["aphrody[images]", "resvg-py>=0.3", "scour>=0.38", "pyconify>=0.2"]
# `aphrody image to3d`: 2D -> 3D. The default `relief` backend needs no GPU and
# no ML (trimesh + numpy + optional scipy for silhouette inflation) and exports
# a vertex-coloured .glb. The `depth` backend adds Depth Anything V2 (monocular
# depth) via transformers + torch (CPU-capable, heavy).
to3d = ["aphrody[images]", "trimesh>=4.4", "numpy>=1.26", "scipy>=1.11"]
depth = ["aphrody[to3d]", "transformers>=4.44", "torch>=2.2"]
dev = ["pytest>=8.0", "pytest-httpx>=0.35"]

[project.scripts]
aphrody = "aphrody.cli:main"

[project.urls]
Homepage = "https://github.com/aphrody-code/aphrody"

[tool.setuptools.packages.find]
include = ["aphrody*"]

[tool.setuptools.package-data]
"aphrody" = ["py.typed"]
"aphrody.ui" = ["*.html", "*.js", "*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

