# SPDX-License-Identifier: Apache-2.0
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name aphrody.com www.aphrody.com api.aphrody.com downloads.aphrody.com
        cdn.aphrody.com bot.aphrody.com admin.aphrody.com
        bxc.aphrody.com nie.aphrody.com n2b.aphrody.com;
    access_log off;

    ssl_certificate /etc/letsencrypt/live/aphrody.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aphrody.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;

    # Healthcheck public de l'origine Rust (y compris api.aphrody.com).
    location = /health {
        proxy_pass http://127.0.0.1:8083/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name aphrody.com www.aphrody.com api.aphrody.com downloads.aphrody.com
        cdn.aphrody.com bot.aphrody.com admin.aphrody.com
        bxc.aphrody.com nie.aphrody.com n2b.aphrody.com;
    access_log off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mcp.aphrody.com;
    access_log off;

    ssl_certificate /etc/letsencrypt/live/aphrody.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aphrody.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    client_max_body_size 1m;

    location = / {
        proxy_pass http://127.0.0.1:8808/mcp;
        include /etc/nginx/conf.d/snippets-mcp.inc;
    }

    location = /mcp {
        proxy_pass http://127.0.0.1:8808/mcp;
        include /etc/nginx/conf.d/snippets-mcp.inc;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8808/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }

    location / {
        return 404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name mcp.aphrody.com;
    access_log off;
    return 301 https://$host$request_uri;
}
