<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font-family: -apple-system, "Segoe UI", sans-serif;
        font-size: 12px;
        margin: 0;
        padding: 10px;
        color: #e6e6e6;
        background: #2a2a2a;
      }
      h1 {
        font-size: 13px;
        margin: 0 0 8px;
        letter-spacing: 0.5px;
      }
      #status {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 3px;
        font-weight: 600;
        margin-bottom: 8px;
      }
      .ok { background: #1e7d34; color: #fff; }
      .bad { background: #8a2020; color: #fff; }
      .wait { background: #7a6a1e; color: #fff; }
      #log {
        white-space: pre-wrap;
        font-family: "SF Mono", Consolas, monospace;
        font-size: 10px;
        background: #1c1c1c;
        border: 1px solid #444;
        border-radius: 3px;
        padding: 6px;
        height: 180px;
        overflow-y: auto;
      }
      sp-button { margin-top: 6px; }
    </style>
  </head>
  <body>
    <h1>aphrody · Photoshop bridge</h1>
    <div id="status" class="wait">connecting…</div>
    <div id="log"></div>
    <sp-button id="reconnect" variant="secondary" quiet>Reconnect</sp-button>
    <script src="./main.js"></script>
  </body>
</html>
