# Self-rooted: this Tauri+Angular desktop app lives INSIDE the aphrody repo
# (apps/desktop) but is EXCLUDED from the core cargo workspace (see the root
# Cargo.toml `exclude`). Its own `[workspace]` table stops `cargo` at the root
# from absorbing it, and it carries its own Cargo.lock. It is built via bun
# (Angular) + `cargo`/`tauri`, never by `cargo ci-offline`. Mirrors the
# crates/aphrody-app precedent. The toolchain is inherited from the aphrody
# root rust-toolchain.toml (same nightly pin).
[workspace]

[package]
name = "desktop"
version = "0.1.0"
description = "aphrody desktop — consumer AI agent (Tauri 2 + Angular), runs the aphrody CLI in-process"
authors = ["aphrody-code"]
license = "Apache-2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Explicit binary target so `cargo build` emits `aphrody-gui(.exe)` (instead of
# the default, which derives from the package name `desktop`). The package name
# and `[lib] name = "desktop_lib"` are intentionally left unchanged so `main.rs`
# keeps calling `desktop_lib::run()`. This matches the `aphrody gui` resolver in
# the core CLI, which looks for an `aphrody-gui` binary sibling to `aphrody`.
# Tauri's `tauri build`/`bundle` rename is locked to the same name via
# `mainBinaryName` in tauri.conf.json, keeping `cargo` and `tauri` consistent.
[[bin]]
name = "aphrody-gui"
path = "src/main.rs"

[features]
# PRODUCTION GATE -- DO NOT REMOVE. Tauri decides dev-vs-production purely by
# `tauri::is_dev() == !cfg!(feature = "custom-protocol")` (tauri 2.11
# src/lib.rs:308). With this feature OFF (a bare `cargo build`/`cargo run`, even
# `--release`) the webview loads `build.devUrl` (http://localhost:1420) and shows
# "localhost refused to connect" when no `ng serve` is up. With it ON the webview
# serves the embedded `build.frontendDist` over the `tauri://` protocol.
# `tauri build` enables it automatically; for a cargo-only production binary use
# `cargo build --release --features custom-protocol`.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# In-process Rust -> Rust: aphrody is the CLI library (crate `aphrody`, dir
# crates/cli in THIS repo). Default features only (no magika/forensics/index
# -> no ort, rusqlite, C toolchain) so the shell stays lean. Mirrors
# crates/aphrody-app. Relative path: src-tauri -> desktop -> apps -> repo root.
aphrody = { path = "../../../crates/cli" }

# Voice I/O (TTS + STT): default features only — no local-whisper / ort / C toolchain.
# Relative path mirrors the CLI dep above.
aphrody-voice = { path = "../../../crates/aphrody-voice" }
base64 = "0.22"

# Keyless STT fallback: when no Whisper/ElevenLabs key is set, `voice_transcribe`
# sends the recorded audio to Gemini via the agy (Antigravity) OAuth token —
# the same keyless Cloud Code path the chat uses (cf. crates/cli agy_backend).
antigravity-sdk = { path = "../../../crates/antigravity-sdk" }

# rustls 0.23 CryptoProvider — installed once at startup so the native voice
# commands' reqwest client does not panic "no process-level CryptoProvider".
# `ring` matches the aphrody workspace (CLAUDE.md §7); features unify with reqwest.
rustls = { version = "0.23", default-features = false, features = ["ring"] }

