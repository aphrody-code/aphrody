# ============================================================================
#  Desktop app (Tauri 2 + Angular) — build the build-EXCLUDED shell separately
#  from the core cargo workspace.
#
#  Why a dedicated workflow: apps/desktop/src-tauri is a self-rooted crate
#  (its own `[workspace]` + Cargo.lock, listed in the root Cargo.toml
#  `exclude`). It pulls the wry/tao/gtk-rs/webkit2gtk tree, which must NEVER
#  enter the core `cargo ci-offline` / `cargo nextest` lock. So we build it
#  here, on its own, with its own system deps.
#
#  Platform priority (CLAUDE.md §0): Linux #1 + Windows #2 are BLOCKING;
#  macOS is best-effort (continue-on-error). deny.toml already ignores the
#  wry/tao GTK3 CVEs, so the core supply-chain gate is unaffected.
# ============================================================================
name: desktop

on:
  push:
    branches: [main, stable, dev]
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    branches: [main, stable]
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  # The desktop shell is self-rooted; build commands target its manifest
  # explicitly so the core .cargo/config.toml default target does not leak in.
  TAURI_MANIFEST: apps/desktop/src-tauri/Cargo.toml

jobs:
  build-desktop:
    name: "${{ matrix.label }}"
    runs-on: ${{ matrix.os }}
    # macOS is best-effort per CLAUDE.md §0 (priority order Linux #1, Windows
    # #2, wasm #3, macOS best-effort). Linux + Windows are blocking.
    continue-on-error: ${{ matrix.best_effort }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: "[#1] Linux desktop (Tauri build)"
            best_effort: false
          - os: windows-latest
            label: "[#2] Windows desktop (Tauri build)"
            best_effort: false
          - os: macos-latest
            label: "[best-effort] macOS desktop (Tauri build)"
            best_effort: true
    steps:
      - uses: actions/checkout@v4

      # Pinned to nightly SHA 2026-05-17 (matches rust-toolchain.toml and the
      # other workflows); re-pin via:
      #   gh api repos/dtolnay/rust-toolchain/branches/nightly --jq .commit.sha
      - name: Setup Rust (Nightly, pinned)
        uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2
        with:
          toolchain: nightly

      - name: Rust Cache (scoped to the excluded crate)
        uses: Swatinem/rust-cache@v2
        with:
          # Distinct keys so the desktop lock never shares a cache with the
          # core workspace jobs.
          shared-key: desktop-${{ matrix.os }}
          workspaces: apps/desktop/src-tauri

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Tauri v2 on Linux needs the GTK3 + WebKitGTK 4.1 dev stack, the app
      # indicator (tray), librsvg (icon rasterisation) and patchelf (AppImage
      # relinking). webkit2gtk-4.1 is the Ubuntu 24.04+ package (CLAUDE.md
      # target #1 is Ubuntu 26.04; ubuntu-latest is the runner fallback).
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            patchelf \
            file

      - name: Install frontend deps (Bun, frozen lockfile)
        working-directory: apps/desktop
        run: bun install --frozen-lockfile

      - name: Build Angular frontend
        working-directory: apps/desktop
        run: bun run build

      # Compile gate: prove the excluded crate builds on its own, with its own
      # Cargo.lock, decoupled from the core workspace. `--locked` keeps the
      # self-rooted lock honest.
      - name: Build desktop shell (cargo, locked)
        run: cargo build --release --locked --manifest-path "${{ env.TAURI_MANIFEST }}"

      # Bundle gate (Linux #1 + Windows #2 only): produce the real installers
      # the user downloads. Runs after the compile gate so a bundler-tooling
      # failure is distinguishable from a code failure in the logs.
      #   Linux  -> .deb + .AppImage
      #   Windows-> .msi (WiX) + .exe (NSIS, WebView2 downloadBootstrapper)
      - name: Install Tauri CLI
        if: runner.os != 'macOS'
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@^2

      - name: Bundle installers (tauri build)
        if: runner.os != 'macOS'
        working-directory: apps/desktop
        # Frontend already built above; --no-bundle is NOT passed so the
        # bundler runs. beforeBuildCommand re-runs `bun run build` (idempotent).
        run: cargo tauri build

      - name: Upload installers
        if: runner.os != 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/**/*.deb
            apps/desktop/src-tauri/target/release/bundle/**/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/**/*.msi
            apps/desktop/src-tauri/target/release/bundle/**/*.exe
          if-no-files-found: warn
