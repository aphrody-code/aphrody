# SPDX-License-Identifier: Apache-2.0
name: bench
on:
  push:
    branches: [main, stable]
    paths:
      - 'crates/**/*.rs'
      - 'crates/**/Cargo.toml'
      - 'crates/**/benches/**'
      - 'Cargo.lock'
  pull_request:
    branches: [main, stable]
    paths:
      - 'crates/**/*.rs'
      - 'crates/**/Cargo.toml'
      - 'crates/**/benches/**'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: criterion benches
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2
        with:
          toolchain: nightly
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: bench
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev
      - name: Run criterion benches
        run: |
          cargo bench --workspace --locked 2>&1 | tee bench-output.txt
      - name: Extract summary
        run: |
          # Capture the criterion summary lines (mean ± stddev per bench)
          grep -E "^\w+\s+time:" bench-output.txt > bench-summary.txt || echo "no benches found" > bench-summary.txt
          cat bench-summary.txt
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('bench-summary.txt', 'utf8');
            const body = `## Bench results\n\n\`\`\`\n${summary}\n\`\`\`\n\n_Compare manually against baseline; future versions will run criterion-compare-action._`;
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body,
            });
      - name: Upload bench artifact
        uses: actions/upload-artifact@v4
        with:
          name: bench-output-${{ github.sha }}
          path: bench-output.txt
          retention-days: 30
