# ============================================================================
#  Build Google-OS — workspace clippy/fmt/nextest + supply-chain + bun lint.
#  Policy: nightly toolchain, node forbidden (bun only), least-privilege perms.
# ============================================================================
name: Build Google-OS

on:
  push:
    branches: [master, stable, dev, windows, linux]
  pull_request:
    branches: [master, stable]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  # sccache via mozilla-actions/sccache-action@v0.0.10 (GHA cache backend).
  # Aligned with cross-platform.yml and bench.yml (pipeline-optimization
  # 2026-05-18). Each rust job ends with a non-fatal
  # `sccache --show-stats || true` for graceful degradation.
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

jobs:
  build-rust:
    name: clippy + fmt + nextest + deny (Windows)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust (Nightly)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rustfmt

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-windows

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Run tests
        run: cargo nextest run --workspace --all-targets --all-features --locked

      - name: sccache stats (non-fatal)
        if: always()
        shell: bash
        run: sccache --show-stats || true

      - name: Run cargo-deny
        env:
          # cargo-deny-action runs without sccache available in its container;
          # unset the wrapper to avoid `sccache: command not found` on
          # `cargo metadata`.
          RUSTC_WRAPPER: ""
          SCCACHE_GHA_ENABLED: ""
        uses: EmbarkStudios/cargo-deny-action@v2

  lint-bun:
    name: bun lint (TypeScript / scripts)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          # Primary key keys off both lockfile formats so a switch between
          # bun.lock (text) and bun.lockb (binary) does not invalidate the
          # cache. restore-keys fall back to any previous bun cache snapshot.
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Run linter
        run: bun run lint:all
