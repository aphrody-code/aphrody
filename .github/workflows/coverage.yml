name: coverage

on:
  push:
    branches: [master, stable]
  pull_request:
    branches: [master, stable]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  llvm-cov:
    name: coverage (llvm-cov, Linux x64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # Pinned to nightly SHA 2026-05-17; re-pin via:
      #   gh api repos/dtolnay/rust-toolchain/branches/nightly --jq .commit.sha
      - uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2
        with:
          toolchain: nightly
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,nextest
      - uses: Swatinem/rust-cache@v2

      - name: cargo llvm-cov (lcov)
        run: cargo llvm-cov --workspace --locked --lcov --output-path lcov.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info
          retention-days: 14
