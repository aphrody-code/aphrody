# Rustfmt — Google/Fuchsia style (aligned with `fx rustfmt` settings).
# Stable + nightly-only options grouped at end (gated by `unstable_features = true`).
edition                       = "2024"
max_width                     = 100
use_small_heuristics          = "Max"
newline_style                 = "Unix"
hard_tabs                     = false
tab_spaces                    = 4

# Imports — Fuchsia conventions
imports_granularity           = "Crate"
group_imports                 = "StdExternalCrate"
reorder_imports               = true
reorder_modules               = true

# Docs & comments
format_code_in_doc_comments   = true
format_strings                = true
wrap_comments                 = true
comment_width                 = 100
normalize_comments            = true
normalize_doc_attributes      = true

# Match / where / chains
match_arm_blocks              = true
match_block_trailing_comma    = true
overflow_delimited_expr       = true
trailing_comma                = "Vertical"
trailing_semicolon            = true
use_field_init_shorthand      = true
use_try_shorthand             = true

# Unstable features (require nightly rustfmt). Safe to enable since we pin nightly.
unstable_features             = true
condense_wildcard_suffixes    = true
inline_attribute_width        = 80
imports_indent                = "Block"
struct_field_align_threshold  = 0    # 0 = disable, set higher for column-align
fn_single_line                = false
empty_item_single_line        = true
where_single_line             = false
force_explicit_abi            = true
force_multiline_blocks        = false
blank_lines_upper_bound       = 1
blank_lines_lower_bound       = 0
