# ============================================================================
#  Bun configuration — Aphrody monorepo (2026 hardened)
#  Reference: https://bun.com/docs/runtime/bunfig
# ============================================================================

# --- Security ----------------------------------------------------------------
# Disable implicit .env autoloading; we explicitly load hardened secrets.
env = false

# Telemetry off — no analytics leave this machine.
telemetry = false

# --- Install -----------------------------------------------------------------
[install]
# Reproducible installs: fail if bun.lock would change.
frozenLockfile = true
# Lock the registry to avoid drift between contributors.
registry = "https://registry.npmjs.org/"
# Hoist via hardlinks where possible — faster + saves disk.
linker = "hoisted"
# Always save exact versions; semver ranges are footguns in monorepos.
exact = true
# Save the lockfile after install (default true, made explicit).
saveTextLockfile = true

[install.cache]
# Disable global tarball reuse cache invalidation surprises.
disableManifest = false

[install.scopes]
# Pin private/internal scopes here when applicable.

# --- Test --------------------------------------------------------------------
[test]
# Default to root-relative test discovery.
root = "."
# Coverage off by default; enable per-invocation with --coverage.
coverage = false
coverageThreshold = 0.85

# --- Runtime -----------------------------------------------------------------
[run]
# Use Bun's bundler for `bun run` scripts instead of the system shell.
bun = true
# Surface shell errors instead of swallowing them.
shell = "bun"
