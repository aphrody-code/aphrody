#
# cargo-deb configuration snippet.
# Paste this block into crates/cli/Cargo.toml under [package].
#
# Prerequisites:
#   cargo install cargo-deb
#
# Build:
#   cargo deb -p aphrody
#   # or, for a cross-compiled arm64 binary:
#   cargo deb -p aphrody --target aarch64-unknown-linux-gnu
#
# Output lands at: target/debian/aphrody_<VERSION>_<ARCH>.deb
#
# Notes:
#   - `maintainer-scripts` points at the packaging/deb/ directory; cargo-deb
#     will pick up postinst and prerm automatically by filename convention.
#   - `control` overrides the inline template with an external file so the
#     release pipeline can do variable substitution on __VERSION__ before the
#     .deb is assembled. Remove the `control` key to let cargo-deb generate
#     the control file from Cargo.toml metadata instead.
#   - For a musl static build, add a second [[package.metadata.deb.variants]]
#     section named "musl" with `depends = "libc6"` and no libssl3 entry.

[package.metadata.deb]
name             = "aphrody"
maintainer       = "aphrody-code <noreply@aphrody-code.dev>"
copyright        = "2026 aphrody-code contributors"
license-file     = ["LICENSE", "4"]
extended-description = """\
aphrody is a cross-platform Rust CLI covering forensics, A2A agent \
orchestration, MCP tool server, and monorepo mapper (mrx). \
Built with Rust nightly Edition 2024; hermetic Google-grade supply chain \
(cargo-deny + cargo-vet)."""
depends          = "$auto, libc6 (>= 2.38), libssl3 (>= 3.0)"
section          = "utils"
priority         = "optional"
assets           = [
    ["target/release/aphrody", "usr/bin/", "755"],
]
maintainer-scripts = "packaging/deb/"

# Uncomment to use the external control template (see control.template).
# The CI pipeline substitutes __VERSION__ then passes --deb-version to cargo-deb.
# control = "packaging/deb/control.template"
