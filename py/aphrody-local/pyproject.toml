[project]
name = "aphrody-local"
version = "0.1.0"
description = "aphrody-local — local open-weight AI orchestrator (OpenAI-compatible chat + RAGFlow/local RAG) complementing the Rust aphrody-serve."
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "aphrody-code" }]
dependencies = [
    "openai>=1.40",
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Torch-free local RAG (ONNX embeddings + cross-encoder rerank).
rag-local = ["fastembed>=0.3"]
# Heavyweight RAGFlow engine client (requires the RAGFlow Docker stack).
rag-ragflow = ["ragflow-sdk>=0.15"]
pdf = ["pypdf>=4"]
all = ["fastembed>=0.3", "ragflow-sdk>=0.15", "pypdf>=4"]

[project.scripts]
aphrody-local = "aphrody_local.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aphrody_local"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]
