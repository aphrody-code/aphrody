[tool.uv]
managed = true

# Extracted 2026-05-23 from the aphrody monorepo into the sibling repo
# C:\src\aphrody-py. Packages that lived under python/* now sit at repo root.
[tool.uv.workspace]
members = [
    "aphrody",
    "antigravity-sdk-python",
]

[tool.uv.sources]
langextract = { git = "https://github.com/google/langextract.git" }
google-antigravity = { workspace = true }

[tool.pytest.ini_options]
# Keep pytest's defaults (*.egg, .* → .venv/.uv-cache, build, dist,
# node_modules, venv) and additionally skip `var/` (uv archive cache writes
# vendored package test suites under var/cache/archive-v0/) and `target/`
# (Rust build dir). Without this, a bare `pytest` from the workspace root
# collects setuptools/jsonschema test modules and aborts on import mismatch.
norecursedirs = [
    "*.egg",
    ".*",
    "_darcs",
    "build",
    "CVS",
    "dist",
    "node_modules",
    "venv",
    "{arch}",
    "var",
    "target",
]

[tool.ruff]
line-length = 80
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "PL",  # pylint
    "RUF", # ruff-specific rules
    "D",   # pydocstyle
]
ignore = [
    "E501",    # Line too long (managed by ruff format / formatting and style guides differ on comments/urls/long strings)
    "D105",    # Missing docstring in magic method
    "D107",    # Missing docstring in __init__
    "PLC0415", # Import outside top-level of a file (used for lazy loads and tests)
    "PLR0911", # Too many return statements
    "PLR0912", # Too many branches
    "PLR0913", # Too many arguments
    "PLR0915", # Too many statements
    "PLR2004", # Magic value used in comparison
    "PLW0603", # Using global statement
    "RUF001",  # Ambiguous unicode character
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.per-file-ignores]
"**/*_test.py" = ["D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107", "PLR2004"]
"**/tests/**/*.py" = ["D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107", "PLR2004"]
"**/test_utils.py" = ["D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107"]
"**/__init__.py" = ["F401", "D104"]
# Blender add-ons follow Blender's required conventions: bl_info before imports
# (E402), CATEGORY_TYPE_name operator/panel class names (N801), bl_options sets
# (RUF012), and class-level operator docstrings instead of per-method (D102).
"**/blender_addon/**" = ["E402", "N801", "D102", "RUF012"]
"examples/**/*.py" = ["D"]
"antigravity-sdk-python/**/*.py" = ["D", "UP042", "N805", "F841", "UP007"]



