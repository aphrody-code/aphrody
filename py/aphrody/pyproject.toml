# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "aphrody"
version = "0.1.0"
description = "Keyless Python client/CLI for Google's AI Ultra stack (Gemini, Cloud Code, Vertex AI) — uses on-device OAuth credentials, never an API key."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "aphrody contributors" }]
keywords = ["gemini", "vertex-ai", "cloud-code", "antigravity", "oauth", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "httpx>=0.28",
    "fire>=0.7",
    "google-genai>=1.0",
    "google-auth>=2.30",
    "scrapy>=2.16.0",
]

[project.optional-dependencies]
# Browser-cookie extraction is LGPL-3.0; kept as an isolated optional extra
# so the core package stays Apache-2.0-clean (dynamic import = separate work).
cookies = ["browser-cookie3>=0.20"]
# `aphrody voice`: local Whisper STT + Kokoro TTS + the Antigravity agent brain
# (google-antigravity[voice] pulls faster-whisper, kokoro-onnx, numpy,
# websockets). The agent's localharness binary itself ships with the
# Antigravity desktop app; aphrody points ANTIGRAVITY_HARNESS_PATH at it.
voice = ["google-antigravity[voice]"]
# `aphrody image optimize` + `image icon` + the batch optimiser: lossless PNG
# via the oxipng Rust core, and WebP/AVIF/ICO re-encoding via Pillow >= 12
# (native AVIF, multi-resolution .ico).
images = ["pyoxipng>=9.1", "Pillow>=12.0"]
# `aphrody image icon`: Material 3 icon tooling. resvg-py rasterises SVG with
# zero system deps (Rust wheel — no Cairo); scour minifies SVG (pure Python,
# svgo is Node and banned); pyconify fetches Material Symbols by name from the
# Iconify API (no giant clone needed). Pillow writes multi-size Windows .ico.
icons = ["aphrody[images]", "resvg-py>=0.3", "scour>=0.38", "pyconify>=0.2"]
# `aphrody image to3d`: 2D -> 3D. The default `relief` backend needs no GPU and
# no ML (trimesh + numpy + optional scipy for silhouette inflation) and exports
# a vertex-coloured .glb. The `depth` backend adds Depth Anything V2 (monocular
# depth) via transformers + torch (CPU-capable, heavy).
to3d = ["aphrody[images]", "trimesh>=4.4", "numpy>=1.26", "scipy>=1.11"]
depth = ["aphrody[to3d]", "transformers>=4.44", "torch>=2.2"]
# `aphrody.antigravity_bridge`: run the google-antigravity SDK (Agent /
# Conversation) against aphrody's keyless Vertex backend — no local Go harness
# and no API key. The SDK is a workspace member, so this resolves locally.
antigravity = ["google-antigravity>=0.1.1"]
# `aphrody forensic <target>`: filesystem forensic + classification + RAG +
# auto-ML pipeline aimed at the Antigravity IDE install and its data dirs. All
# permissive (no GPL):
#   - magika (Apache-2.0): AI content-type classification (statique). Pinned
#     to ~=0.6.1 because markitdown hard-pins `magika~=0.6.1` as a *core* dep
#     (not optional) — magika 1.0 and markitdown are mutually unsatisfiable in
#     one env. classify.py supports both the 0.6 (``output.ct_label``) and 1.x
#     (``output.label``) result shapes, so a future markitdown bump is a no-op.
#   - lief (Apache-2.0): static PE/DLL inspection (imports/exports/sections/
#     Authenticode) — never executes the analysed binary.
#   - markitdown[pdf,docx,pptx,xlsx] (MIT): documents -> markdown corpus.
#   - fastembed (Apache-2.0): local ONNX embeddings for the RAG index (the
#     vector store is a dependency-free numpy implementation in-repo).
# Gemini (llm.py) reuses aphrody's keyless GeminiVertex — no extra dep.
forensic = [
    "magika~=0.6.1",
    "lief>=0.17",
    "markitdown[pdf,docx,pptx,xlsx]>=0.1.5",
    "fastembed>=0.8",
    "numpy>=1.26",
]
rag = [
    "scikit-learn>=1.4",
    "umap-learn>=0.5",
    "networkx>=3.0",
    "numpy>=1.26",
    "tiktoken>=0.6",
]
dev = ["pytest>=8.0", "pytest-httpx>=0.35", "pytest-asyncio>=0.23"]

[project.scripts]
aphrody = "aphrody.cli:main"

[project.urls]
Homepage = "https://github.com/aphrody-code/aphrody"

[tool.maturin]
python-source = "."
module-name = "aphrody.aphrody_rust"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

