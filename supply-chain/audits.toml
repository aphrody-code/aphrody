
# cargo-vet audits file

[criteria.crypto-safe]
description = """
The crate implements cryptographic primitives and has been reviewed for:
- constant-time operations on secret material,
- no panics on attacker-controlled input,
- well-vetted upstream (e.g. RustCrypto, ring, aws-lc-rs).
"""
implies = "safe-to-deploy"

[criteria.does-not-implement-crypto]
description = """
The crate does not implement any cryptographic primitive (helpful negative
audit when the crate name suggests crypto but it's actually a wrapper).
"""

[criteria.ub-risk-0]
description = """
No `unsafe` blocks anywhere in the crate. Safe by construction at the Rust
level (modulo soundness bugs in the compiler itself).
"""

[criteria.ub-risk-1]
description = """
`unsafe` blocks present and reviewed. Each block has been audited by a
qualified reviewer and judged sound under the documented preconditions.
Equivalent of Fuchsia's `ub-risk-1`.
"""
implies = "ub-risk-0"

[criteria.ub-risk-2]
description = """
`unsafe` blocks present, partially reviewed, residual risk acceptable for
non-privileged contexts. Crate may be used in user-mode code that does not
handle untrusted input.
"""

[criteria.ub-risk-3]
description = """
`unsafe` blocks present, unreviewed, or known soundness issues exist.
Use only behind a hard isolation boundary (sandbox, process boundary).
"""

[[audits.block-buffer]]
who = "aphrody-code"
criteria = "safe-to-run"
version = "0.9.0"
notes = """
Two unsafe blocks: `slice::from_raw_parts` over a sub-slice of known length
(sound, pointer stays within same allocation) and `ptr::write_bytes` zeroing a
mutable slice (sound). No I/O, no process spawning, no panics on external input.
`#[no_std]`. RustCrypto project.
"""

[[audits.opaque-debug]]
who = "aphrody-code"
criteria = "safe-to-run"
version = "0.3.0"
notes = """
Zero unsafe blocks. Single-file `#[no_std]` declarative-macro crate that emits
an opaque `Debug` impl (`StructName { ... }`). No I/O, no process spawning.
RustCrypto project.
"""

[[audits.subtle]]
who = "aphrody-code"
criteria = "safe-to-run"
version = "2.6.1"
notes = """
One unsafe block: `core::ptr::read_volatile(&input)` in the `black_box`
optimization-barrier helper (active only without `core_hint_black_box` feature).
Pointer is a non-null, aligned, Copy stack local — sound. No I/O, no process
spawning, no panics on external input. `#[no_std]`. Dalek cryptography project,
widely used by the RustCrypto ecosystem.
"""

[[audits.wasm-bindgen-futures]]
who = "aphrody-code"
criteria = "safe-to-run"
version = "0.4.71"
notes = """
Pure re-export shim (`pub use js_sys::futures::*`). Zero unsafe blocks in this
crate's own source. No I/O, no process spawning. Unsafe surface delegated to
`js-sys` core. Official wasm-bindgen project (rustwasm WG).
"""

[[audits.wasm-bindgen-macro]]
who = "aphrody-code"
criteria = "safe-to-run"
version = "0.2.121"
notes = """
Zero unsafe in the entry-point lib.rs; ~50 unsafe lines in macro-support are
code-generation tokens emitted into user crates (ABI shims, repr-transparent
transmutes), not executed in the proc-macro process. No file writes outside
build system temp dirs, no network, no process spawning at macro-expansion time.
Compile-time only. Official wasm-bindgen project (rustwasm WG).
"""
