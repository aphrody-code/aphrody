# SPDX-License-Identifier: Apache-2.0
# ============================================================================
#  Bun-RS — Cargo Crate wrapping all Bun Rust Crates as Path Dependencies
# ============================================================================

[package]
name = "bun-rs"
version = "1.0.0-canary"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "High-level bridge re-exporting the entire set of Bun core Rust crates."

[lib]
name = "bun_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
bun_opaque = { path = "/tmp/bun/src/opaque" }
bun_analytics = { path = "/tmp/bun/src/analytics" }
