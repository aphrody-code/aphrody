<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>aphrody console</title>
    <style>
      /* Colour tokens come from @aphrody-code/theme (the canonical M3 fusion,
         imported in app.ts). This sheet carries only the console's layout. */
      html.dark {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--md-sys-color-surface);
        color: var(--md-sys-color-on-surface);
        font-family:
          "Google Sans Text",
          "Roboto",
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        font-size: 14px;
        line-height: 1.5;
      }

      header {
        display: flex;
        align-items: baseline;
        gap: 12px;
        padding: 16px 24px;
        border-bottom: 1px solid var(--md-sys-color-outline-variant);
      }

      header h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 500;
        letter-spacing: 0.1px;
      }

      #version {
        color: var(--md-sys-color-on-surface-variant);
        font-size: 13px;
        font-variant-numeric: tabular-nums;
      }

      main {
        max-width: 920px;
        margin: 0 auto;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .presets {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .chip {
        appearance: none;
        border: 1px solid var(--md-sys-color-outline);
        background: transparent;
        color: var(--md-sys-color-on-surface-variant);
        border-radius: 8px;
        padding: 7px 14px;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
        transition: background-color 0.15s ease;
      }

      .chip:hover {
        background: var(--md-sys-color-surface-container-high);
      }

      form {
        display: flex;
        gap: 12px;
        align-items: stretch;
      }

      .field {
        flex: 1;
        display: flex;
        align-items: center;
        background: var(--md-sys-color-surface-container);
        border: 1px solid var(--md-sys-color-outline);
        border-radius: 8px;
        padding: 0 14px;
      }

      .field span {
        color: var(--md-sys-color-primary);
        font-family: "Roboto Mono", ui-monospace, "Cascadia Code", monospace;
        margin-right: 8px;
        user-select: none;
      }

      .field input {
        flex: 1;
        border: none;
        outline: none;
        background: transparent;
        color: var(--md-sys-color-on-surface);
        font-family: "Roboto Mono", ui-monospace, "Cascadia Code", monospace;
        font-size: 14px;
        padding: 13px 0;
      }

      button.run {
        appearance: none;
        border: none;
        background: var(--md-sys-color-primary);
        color: var(--md-sys-color-on-primary);
        border-radius: 8px;
        padding: 0 24px;
        font: inherit;
        font-weight: 500;
        cursor: pointer;
        transition: opacity 0.15s ease;
      }

      button.run:disabled {
        opacity: 0.5;
        cursor: default;
      }

      .output {
        background: var(--md-sys-color-surface-container);
        border-radius: 12px;
        padding: 16px 18px;
        min-height: 160px;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        font-weight: 500;
        padding: 4px 10px;
        border-radius: 999px;
        margin-bottom: 12px;
        background: var(--md-sys-color-secondary-container);
        color: var(--md-sys-color-on-secondary-container);
      }

      .status[data-state="ok"] {
        color: var(--md-sys-color-primary);
      }

      .status[data-state="err"] {
        color: var(--md-sys-color-error);
      }

      pre {
        margin: 0;
        white-space: pre-wrap;
        word-break: break-word;
        font-family: "Roboto Mono", ui-monospace, "Cascadia Code", monospace;
        font-size: 13px;
      }

      pre.stderr {
        color: var(--md-sys-color-error);
        margin-top: 10px;
      }

      .hint {
        color: var(--md-sys-color-on-surface-variant);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>aphrody console</h1>
      <span id="version">connecting…</span>
    </header>
    <main>
      <div class="presets" id="presets">
        <button class="chip" data-cmd="version">version</button>
        <button class="chip" data-cmd="version --json">version --json</button>
        <button class="chip" data-cmd="doctor">doctor</button>
        <button class="chip" data-cmd="doctor --json">doctor --json</button>
        <button class="chip" data-cmd="--help">--help</button>
      </div>
      <form id="form">
        <label class="field">
          <span>aphrody</span>
          <input
            id="input"
            type="text"
            placeholder="doctor --json"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
          />
        </label>
        <button class="run" id="run" type="submit">Run</button>
      </form>
      <section class="output" id="output">
        <p class="hint">
          Runs the real aphrody CLI in-process via the native bridge. Output below is captured from
          the actual command — exit code, stdout and stderr.
        </p>
      </section>
    </main>
    <script type="module" src="./app.ts"></script>
  </body>
</html>
